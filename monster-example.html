<!DOCTYPE html>
<html>
<head>
<title>Dragon — Natural pixel art 128×128</title>
<style>
body { background: #1a1a2e; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 20px; }
.monster { text-align: center; margin: 20px; }
.monster canvas { border: 2px solid #444; image-rendering: pixelated; background: #2a2a4e; }
.label { margin-top: 8px; font-size: 14px; color: #aaa; }
</style>
</head>
<body>
<div class="monster">
<canvas id="dragon" width="512" height="512"></canvas>
<div class="label">Dragon (Boss) — Natural organic design</div>
</div>

<script>
const canvas = document.getElementById('dragon');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 128, H = 128;
const off = document.createElement('canvas');
off.width = W; off.height = H;
const g = off.getContext('2d');

function px(x, y, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), 1, 1); }
function bl(x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
function hs(x, y, len, c) { if (len > 0) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(len), 1); } }

// Fill a smooth elliptical region scanline by scanline
function fillOval(cx, cy, rx, ry, color) {
  g.fillStyle = color;
  for (let dy = -ry; dy <= ry; dy++) {
    const hw = rx * Math.sqrt(Math.max(0, 1 - (dy*dy)/(ry*ry)));
    const x0 = Math.round(cx - hw);
    const x1 = Math.round(cx + hw);
    if (x1 > x0) g.fillRect(x0, Math.round(cy + dy), x1 - x0, 1);
  }
}

// Fill a smooth circle scanline by scanline
function fillDisc(cx, cy, r, color) { fillOval(cx, cy, r, r, color); }

// Fill a smooth tapered shape between two points (like a limb)
function fillLimb(x1, y1, r1, x2, y2, r2, color) {
  const dist = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
  const steps = Math.ceil(dist * 1.5);
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const x = x1 + (x2 - x1) * t;
    const y = y1 + (y2 - y1) * t;
    const r = r1 + (r2 - r1) * t;
    fillDisc(x, y, r, color);
  }
}

// Fill a curved bezier limb
function fillCurvedLimb(x1,y1,r1, cx1,cy1, x2,y2,r2, color) {
  const steps = 40;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const mt = 1 - t;
    const x = mt*mt*x1 + 2*mt*t*cx1 + t*t*x2;
    const y = mt*mt*y1 + 2*mt*t*cy1 + t*t*y2;
    const r = r1 + (r2 - r1) * t;
    fillDisc(x, y, r, color);
  }
}

// Color helpers
function hexColor(r, g, b) { return `rgb(${r},${g},${b})`; }
function lerpColor(c1, c2, t) {
  const r1 = parseInt(c1.slice(1,3),16), g1 = parseInt(c1.slice(3,5),16), b1 = parseInt(c1.slice(5,7),16);
  const r2 = parseInt(c2.slice(1,3),16), g2 = parseInt(c2.slice(3,5),16), b2 = parseInt(c2.slice(5,7),16);
  const r = Math.round(r1+(r2-r1)*t), gr = Math.round(g1+(g2-g1)*t), b = Math.round(b1+(b2-b1)*t);
  return `rgb(${r},${gr},${b})`;
}

// ═══ PALETTE ═══
const OL = '#180505';
const D1 = '#441010';
const D2 = '#661818';
const D3 = '#882222';
const D4 = '#aa2828';
const D5 = '#cc3333';
const D6 = '#dd4444';
const D7 = '#ee5a5a';
const D8 = '#ff7766';
const BEL = '#ddaa66';
const BED = '#cc9950';
const BE0 = '#aa7733';
const HRK = '#332211';
const HRN = '#554422';
const HRL = '#776644';
const HRT = '#998866';
const WBN = '#442020';
const WMD = '#551515';
const WMM = '#772222';
const WML = '#993333';
const WMH = '#aa4040';

// ═══ GROUND SHADOW ═══
fillOval(64, 122, 44, 3, 'rgba(0,0,10,0.35)');

// ═══ TAIL — smooth taper curving right and up ═══
fillCurvedLimb(82,72,8, 100,60, 118,48,3, D3);
fillCurvedLimb(82,72,6, 100,62, 118,50,2, D5);
// Tail spade
fillOval(120, 46, 4, 6, D1);
fillOval(120, 46, 3, 5, D2);
// Tail spines
fillDisc(92, 64, 2, D1); fillDisc(100, 58, 2, D1); fillDisc(108, 53, 1.5, D1);

// ═══ LEFT WING (behind body, upper-left) ═══
// Main bone
fillCurvedLimb(52,48,2, 30,20, 14,6,1.5, WBN);
// Second finger
fillCurvedLimb(50,50,1.5, 25,32, 10,18,1, WBN);
// Membrane between fingers
for (let t = 0; t <= 1; t += 0.02) {
  const mt = 1 - t;
  // Top edge (main bone)
  const tx = mt*mt*52 + 2*mt*t*30 + t*t*14;
  const ty = mt*mt*48 + 2*mt*t*20 + t*t*6;
  // Bottom edge (second finger)
  const bx = mt*mt*50 + 2*mt*t*25 + t*t*10;
  const by = mt*mt*50 + 2*mt*t*32 + t*t*18;
  const steps = Math.max(1, Math.ceil(Math.abs(by - ty)));
  for (let j = 0; j <= steps; j++) {
    const jt = j / steps;
    const mx = tx + (bx - tx) * jt;
    const my = ty + (by - ty) * jt;
    const c = jt < 0.3 ? WMH : jt < 0.6 ? WML : jt < 0.8 ? WMM : WMD;
    px(mx, my, c);
  }
}
// Wing tip claws
fillDisc(13, 5, 2, HRN); fillDisc(9, 17, 1.5, HRN);

// ═══ RIGHT WING (behind body, upper-right — larger) ═══
// Main bone
fillCurvedLimb(68,48,2.5, 90,18, 116,4,1.5, WBN);
// Second finger
fillCurvedLimb(70,50,2, 95,30, 118,22,1, WBN);
// Third finger
fillCurvedLimb(70,52,1.5, 90,44, 110,38,1, WBN);
// Membrane between main and third finger
for (let t = 0; t <= 1; t += 0.015) {
  const mt = 1 - t;
  const tx = mt*mt*68 + 2*mt*t*90 + t*t*116;
  const ty = mt*mt*48 + 2*mt*t*18 + t*t*4;
  const bx = mt*mt*70 + 2*mt*t*90 + t*t*110;
  const by = mt*mt*52 + 2*mt*t*44 + t*t*38;
  const steps = Math.max(1, Math.ceil(Math.abs(by - ty)));
  for (let j = 0; j <= steps; j++) {
    const jt = j / steps;
    const mx = tx + (bx - tx) * jt;
    const my = ty + (by - ty) * jt;
    const c = jt < 0.2 ? WMH : jt < 0.45 ? WML : jt < 0.7 ? WMM : WMD;
    px(mx, my, c);
  }
}
// Wing claws
fillDisc(117, 3, 2, HRN); fillDisc(119, 21, 1.5, HRN);
fillDisc(111, 37, 1.5, HRN);

// ═══ BACK LEGS (behind body) ═══
// Back-right leg: thigh → knee → shin → foot
fillCurvedLimb(76,86,7, 82,96, 80,106,5, D3);
fillCurvedLimb(76,86,5, 82,96, 80,106,3.5, D5);
// Foot pad
fillOval(80, 112, 8, 3, D3);
fillOval(80, 112, 6, 2, D4);
// Toes/claws
fillDisc(72, 114, 2, '#333'); fillDisc(76, 115, 2, '#333');
fillDisc(84, 115, 2, '#333'); fillDisc(88, 114, 2, '#333');

// Back-left leg
fillCurvedLimb(68,86,6, 66,96, 67,106,4.5, D2);
fillCurvedLimb(68,86,4, 66,96, 67,106,3, D4);
fillOval(67, 112, 7, 3, D2);
fillOval(67, 112, 5, 2, D3);
fillDisc(60, 114, 2, '#333'); fillDisc(64, 115, 2, '#333');
fillDisc(70, 115, 2, '#333'); fillDisc(74, 114, 2, '#333');

// ═══ BODY — large barrel chest ═══
// Body outline shadow
fillOval(64, 72, 28, 20, OL);
// Main body fill
fillOval(64, 72, 26, 18, D3);
// Lighter mid-body
fillOval(64, 72, 23, 16, D5);
// Highlight on upper body
fillOval(64, 68, 20, 10, D6);
// Belly — lighter warm tone
fillOval(64, 78, 18, 10, BED);
fillOval(64, 78, 14, 7, BEL);
// Belly plate lines
for (let i = 0; i < 5; i++) {
  const ly = 74 + i * 3;
  const hw = 12 - Math.abs(i - 2) * 2;
  hs(64 - hw, ly, hw * 2, BE0);
}
// Body scale texture (subtle dark dots in diamond pattern)
for (let row = 0; row < 4; row++) {
  for (let col = 0; col < 6; col++) {
    const sx = 46 + col * 7 + (row % 2) * 3;
    const sy = 60 + row * 5;
    px(sx, sy, D2);
    px(sx+1, sy+1, D2);
  }
}
// Body rim highlight (top edge catches light)
for (let t = -0.4; t <= 0.4; t += 0.02) {
  const angle = -Math.PI/2 + t;
  const ex = 64 + 25 * Math.cos(angle);
  const ey = 72 + 17 * Math.sin(angle);
  px(ex, ey, D7);
}

// ═══ FRONT LEGS ═══
// Front-right leg (closer to viewer)
fillCurvedLimb(56,86,6, 54,96, 52,106,4.5, D4);
fillCurvedLimb(56,86,4, 54,96, 52,106,3, D6);
// Highlight
fillCurvedLimb(56,86,2, 54,93, 52,100,1, D7);
// Foot
fillOval(52, 112, 7, 3, D3);
fillOval(52, 112, 5, 2, D5);
// Claws
fillDisc(44, 114, 2, '#333'); fillDisc(48, 115, 2, '#333');
fillDisc(56, 115, 2, '#333'); fillDisc(60, 114, 2, '#333');

// Front-left leg
fillCurvedLimb(46,86,5.5, 42,96, 40,106,4, D3);
fillCurvedLimb(46,86,3.5, 42,96, 40,106,2.5, D5);
fillOval(40, 112, 6.5, 3, D2);
fillOval(40, 112, 5, 2, D4);
fillDisc(33, 114, 2, '#333'); fillDisc(37, 115, 2, '#333');
fillDisc(43, 115, 2, '#333'); fillDisc(47, 114, 2, '#333');

// ═══ NECK — smooth S-curve from body to head ═══
// Thick at body end, thinner at head end
fillCurvedLimb(50,56,12, 36,40, 30,28,7, D3);
fillCurvedLimb(50,56,10, 36,40, 30,28,5.5, D5);
// Neck front (belly color)
fillCurvedLimb(56,58,4, 40,44, 36,32,3, BED);
fillCurvedLimb(55,59,2.5, 39,45, 35,33,2, BEL);
// Neck highlight
fillCurvedLimb(46,52,3, 33,38, 27,26,2, D7);

// Dorsal spines along neck
const spinePositions = [
  [42, 48, 3.5], [38, 42, 3], [34, 36, 2.5], [31, 31, 2], [28, 26, 2]
];
for (const [sx, sy, sr] of spinePositions) {
  // Each spine is a small upward-pointing triangle shape
  fillCurvedLimb(sx, sy, sr, sx-1, sy-4, sx-2, sy-6, 0.5, D1);
  fillDisc(sx, sy, sr * 0.6, D1);
}

// ═══ HEAD ═══
// Angular dragon skull — wide at back, tapering to pointed snout
// Skull back (wide, angular)
fillOval(28, 22, 10, 8, OL);
fillOval(28, 22, 8.5, 6.5, D3);
fillOval(28, 21, 7, 5, D5);

// Upper snout — long, angular, tapering left to a point
// Built as overlapping ovals getting smaller toward the tip
fillOval(20, 22, 8, 5, OL);
fillOval(20, 22, 6.5, 3.8, D3);
fillOval(20, 21.5, 5.5, 3, D5);
fillOval(14, 22.5, 6, 4, OL);
fillOval(14, 22.5, 4.5, 2.8, D3);
fillOval(14, 22, 3.5, 2, D5);
fillOval(8, 23, 4, 3, OL);
fillOval(8, 23, 2.8, 2, D4);
// Snout ridge (top darker line)
fillCurvedLimb(34, 17, 1.5, 20, 18.5, 6, 21, 0.8, D2);
fillCurvedLimb(34, 17.5, 1, 20, 19, 6, 21.5, 0.5, D1);

// ── Lower jaw — angular, slightly narrower ──
fillOval(22, 30, 10, 4, OL);
fillOval(22, 30, 8.5, 3, D2);
fillOval(22, 30, 7, 2, D3);
fillOval(14, 30, 6, 3.5, OL);
fillOval(14, 30, 4.5, 2.5, D2);
fillOval(14, 30, 3.5, 1.5, D3);
fillOval(8, 29.5, 4, 2.5, OL);
fillOval(8, 29.5, 2.5, 1.5, D1);

// ── Mouth interior (dark gap) ──
fillCurvedLimb(30, 26, 2, 18, 27, 5, 27, 1.5, '#1a0303');
fillCurvedLimb(28, 27, 1.5, 16, 27.5, 5, 27.5, 1, '#330808');

// ── Teeth — large, menacing fangs (upper jaw) ──
// Two big front fangs
fillCurvedLimb(8, 25.5, 1.2, 8, 28, 8, 30, 0.4, '#eeeedd');
fillCurvedLimb(12, 25.5, 1.2, 12, 28.5, 12, 31, 0.3, '#eeeedd'); // longer fang
// Smaller teeth
fillCurvedLimb(16, 25.5, 1, 16, 27.5, 16, 29, 0.3, '#eeeedd');
fillCurvedLimb(20, 25.5, 1, 20, 27.5, 20, 29, 0.3, '#ddddcc');
fillCurvedLimb(24, 26, 0.8, 24, 27.5, 24, 28.5, 0.3, '#ddddcc');

// ── Teeth (lower jaw, pointing up) ──
fillCurvedLimb(10, 29, 1, 10, 27.5, 10, 26.5, 0.3, '#ccccbb');
fillCurvedLimb(14, 28.5, 1, 14, 27, 14, 26, 0.3, '#ccccbb');
fillCurvedLimb(18, 28.5, 0.8, 18, 27.5, 18, 26.5, 0.3, '#ccccbb');
fillCurvedLimb(22, 28, 0.8, 22, 27, 22, 26.5, 0.3, '#bbbbaa');

// ── Nostrils — visible on snout tip ──
fillDisc(5, 22, 1.5, OL);
fillDisc(5, 24, 1.5, OL);
px(5.5, 22.5, D1);
px(5.5, 24, D1);
// Smoke wisps from nostrils
px(3, 21, 'rgba(100,50,30,0.4)');
px(2, 20, 'rgba(80,40,25,0.3)');
px(3, 25, 'rgba(100,50,30,0.3)');

// ── Eye — narrow, fierce, angled for angry expression ──
// Eye socket (dark, angular shape using narrow oval)
fillOval(30, 21, 5, 3, OL);
// Iris (yellow, narrow)
fillOval(30, 21, 4, 2.2, '#ffdd00');
// Slit pupil (vertical, thin)
fillCurvedLimb(30, 18.5, 0.8, 30, 21, 30, 23.5, 0.8, '#111100');
fillCurvedLimb(30.3, 19, 0.4, 30.3, 21, 30.3, 23, 0.4, '#000000');
// Eye highlight (small, sharp)
px(28, 19.5, '#ffffff');
px(28.5, 20, '#ffffcc');
// Eye glow
fillDisc(32, 22, 0.8, '#ffee44');

// ── Heavy brow ridge — creates fierce angry expression ──
fillCurvedLimb(24, 17.5, 3, 30, 16, 36, 17.5, 2, OL);
fillCurvedLimb(24, 18, 2, 30, 17, 36, 18, 1.5, D1);
// Brow overhang over eye
fillCurvedLimb(27, 18, 2.5, 31, 17.5, 34, 19, 1, D1);

// ── Head crest / ridge detail ──
fillCurvedLimb(30, 16.5, 1.5, 33, 17, 36, 18, 0.8, D2);

// ═══ HORNS ═══
// Left horn — sweeping curve from back of skull, going up and slightly back
fillCurvedLimb(20, 16, 3.5, 16, 8, 12, 1, 1.5, HRK);
fillCurvedLimb(20, 16, 2.5, 16, 8, 12, 1, 1, HRN);
fillCurvedLimb(20, 15.5, 1.5, 16, 7.5, 12, 0.5, 0.5, HRL);
fillDisc(12, 1, 1, HRT);

// Right horn — mirror, going up and right
fillCurvedLimb(32, 16, 3.5, 36, 8, 38, 1, 1.5, HRK);
fillCurvedLimb(32, 16, 2.5, 36, 8, 38, 1, 1, HRN);
fillCurvedLimb(32, 15.5, 1.5, 36, 7.5, 38, 0.5, 0.5, HRL);
fillDisc(38, 1, 1, HRT);

// ═══ FIRE BREATH ═══
// Erupting from jaws — larger, more dramatic
// Outer flame (red-orange haze)
fillOval(2, 26, 4, 5, '#ee4400');
fillOval(0, 24, 3, 3, '#ff5500');
fillOval(0, 30, 3, 3, '#ee4400');

// Mid flame (orange)
fillOval(3, 26, 3.5, 4, '#ff8800');
fillOval(1, 23, 2.5, 2, '#ffaa22');
fillOval(1, 30, 2.5, 2, '#ff8800');

// Inner flame (bright yellow)
fillOval(4, 26, 3, 3, '#ffcc22');
fillOval(2, 25, 2, 2, '#ffee44');
fillOval(2, 28, 2, 1.5, '#ffee44');

// Core (white-hot)
fillOval(4.5, 26.5, 2, 1.5, '#ffffcc');
fillOval(5, 26.5, 1.5, 1, '#ffffff');

// Sparks flying out
px(0, 19, '#ff6600'); px(1, 17, '#ffaa00'); px(2, 15, '#ffcc00');
px(0, 33, '#ff6600'); px(1, 35, '#ffaa00'); px(3, 37, '#ffcc00');
px(0, 21, '#ff8800'); px(0, 31, '#ff8800');
px(3, 18, '#ffee44'); px(4, 34, '#ffee44');

// Smoke/heat haze
fillDisc(1, 14, 1.5, 'rgba(80,40,30,0.25)');
fillDisc(2, 38, 1.5, 'rgba(80,40,30,0.25)');
fillDisc(0, 16, 1, 'rgba(60,30,20,0.2)');
fillDisc(1, 36, 1, 'rgba(60,30,20,0.2)');

// ═══ SHOULDER RIDGE DETAIL ═══
// Small bumps along back between wings
for (let i = 0; i < 4; i++) {
  fillDisc(52 + i * 5, 55 - i * 0.5, 2, D1);
}

// ═══ BODY TOP SPINES ═══
fillCurvedLimb(48, 55, 1.5, 47, 52, 46, 50, 0.5, D1);
fillCurvedLimb(54, 54, 1.5, 53, 51, 52, 49, 0.5, D1);

// ═══ WING MEMBRANE VEINS (subtle detail) ═══
// Right wing
for (let t = 0.2; t < 0.8; t += 0.15) {
  const mt = 1-t;
  const bx1 = mt*mt*68+2*mt*t*90+t*t*116;
  const by1 = mt*mt*48+2*mt*t*18+t*t*4;
  const bx2 = mt*mt*70+2*mt*t*90+t*t*110;
  const by2 = mt*mt*52+2*mt*t*44+t*t*38;
  fillCurvedLimb(bx1, by1, 0.5, (bx1+bx2)/2, (by1+by2)/2, bx2, by2, 0.3, WBN);
}

// Scale to display
ctx.imageSmoothingEnabled = false;
ctx.drawImage(off, 0, 0, 512, 512);
</script>
</body>
</html>
