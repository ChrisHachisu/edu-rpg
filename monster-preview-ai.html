<head>

<title>AI Monster Sprite Preview - JRPG</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    padding: 20px;
  }
  h1 {
    text-align: center;
    color: #e94560;
    font-size: 28px;
    margin-bottom: 8px;
    text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
  }
  .subtitle {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-bottom: 30px;
  }
  .act-section {
    margin-bottom: 40px;
  }
  .act-header {
    font-size: 20px;
    color: #e94560;
    border-bottom: 2px solid #e94560;
    padding-bottom: 6px;
    margin-bottom: 16px;
    text-shadow: 0 0 6px rgba(233, 69, 96, 0.3);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }
  .card {
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    transition: border-color 0.2s, transform 0.2s;
  }
  .card:hover {
    border-color: #e94560;
    transform: translateY(-2px);
  }
  .card.boss {
    border-color: #e9a045;
    box-shadow: 0 0 8px rgba(233, 160, 69, 0.3);
  }
  .card.boss:hover {
    border-color: #e94560;
  }
  .card.final-boss {
    border-color: #c045e9;
    box-shadow: 0 0 12px rgba(192, 69, 233, 0.4);
  }
  .card img {
    width: 144px;
    height: 144px;
    image-rendering: pixelated;
    background: #0a0a1a;
    border-radius: 4px;
    display: block;
    margin: 0 auto 8px;
  }
  .card .name {
    font-size: 13px;
    color: #e0e0e0;
    font-weight: bold;
  }
  .card.boss .name { color: #e9a045; }
  .card.final-boss .name { color: #c045e9; }
  .badge {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    margin-top: 4px;
  }
  .badge.boss-badge { background: #e9a045; color: #1a1a2e; }
  .badge.final-badge { background: #c045e9; color: #1a1a2e; }
</style>
</head>

  // Act 5

  { section: "Legendary Bosses", id: "sword-wraith", name: "Sword Wraith", prompt: "pixel art JRPG monster sprite, blue spectral knight wielding glowing ethereal sword, ghostly armor, large imposing boss monster, epic powerful, 16-bit retro RPG style, Dragon Quest Final Fantasy inspired, front-facing battle pose, black background, detailed pixel art, game sprite", boss: "boss" },
  { id: "celestial-guardian", name: "Celestial Guardian", prompt: "pixel art JRPG monster sprite, gold and white angelic guardian with radiant wings and holy halo, divine armor, large imposing boss monster, epic powerful, 16-bit retro RPG style, Dragon Quest Final Fantasy inspired, front-facing battle pose, black background, detailed pixel art, game sprite", boss: "boss" },

  { id: "ancient-sphinx", name: "Ancient Sphinx", prompt: "pixel art JRPG monster sprite, gold sphinx with eagle wings and lion body, Egyptian headdress, mystical ancient beast, 16-bit retro RPG style, Dragon Quest Final Fantasy inspired, front-facing battle pose, black background, detailed pixel art, game sprite", boss: false },
  { id: "void-shade", name: "Void Shade", prompt: "pixel art JRPG monster sprite, dark purple and black shadow entity from the void, consuming darkness with glowing violet eyes, 16-bit retro RPG style, Dragon Quest Final Fantasy inspired, front-facing battle pose, black background, detailed pixel art, game sprite", boss: false },
  { id: "dark-knight", name: "Dark Knight", prompt: "pixel art JRPG monster sprite, black armored dark knight with cursed greatsword, glowing red eyes behind visor, ominous dark aura, 16-bit retro RPG style, Dragon Quest Final Fantasy inspired, front-facing battle pose, black background, detailed pixel art, game sprite", boss: false },
];

function buildUrl(prompt, index) {
  const seed = index * 42 + 7;
  return BASE + encodeURIComponent(prompt) + "?" + PARAMS + "&seed=" + seed;
}

let html = "";
let currentSection = null;

monsters.forEach((m, i) => {
  if (m.section && m.section !== currentSection) {
    if (currentSection !== null) html += "</div></div>";
    currentSection = m.section;
    html += '<div class="act-section"><h2 class="act-header">' + m.section + '</h2><div class="grid">';
  }

  const cls = m.boss === "final" ? "card final-boss" : m.boss === "boss" ? "card boss" : "card";
  const badge = m.boss === "final" ? '<div><span class="badge final-badge">FINAL BOSS</span></div>'
    : m.boss === "boss" ? '<div><span class="badge boss-badge">BOSS</span></div>' : "";

  html += '<div class="' + cls + '">'
    + '<img src="' + buildUrl(m.prompt, i + 1) + '" alt="' + m.name + '" loading="lazy" />'
    + '<div class="name">' + m.name + '</div>'
    + badge
    + '</div>';
});

html += "</div></div>";
document.body.insertAdjacentHTML("beforeend", html);
</script>
</body>
</html>
