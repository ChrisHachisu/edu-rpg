<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Quest of Knowledge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0a0a14;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Same bundled face as #qok-ui and the field HUD. ui-overhaul.css declares the
         @font-face and is linked BELOW this block; @font-face is document-scoped, so the
         order does not matter. */
      font-family: 'Zen Maru Gothic', 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Full-page flex centering (desktop framed layout) */
    .frame-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #141428 0%, #0a0a14 70%);
    }

    /* Ornate RPG frame (desktop) */
    .rpg-frame {
      position: relative;
      padding: 12px;
      border: 1px solid rgba(201,169,97,.45);
      outline: 2px solid #3a2f1e;
      outline-offset: 2px;
      background: #111;
      box-shadow: inset 0 0 20px rgba(0,0,0,.8), 0 0 30px rgba(80,60,20,.3), 0 0 60px rgba(0,0,0,.5);
    }
    .rpg-frame::before, .rpg-frame::after {
      content: ''; position: absolute; width: 16px; height: 16px; border: 1px solid #c9a961; z-index: 10;
    }
    .rpg-frame::before { top: 3px; left: 3px; border-right: none; border-bottom: none; }
    .rpg-frame::after { top: 3px; right: 3px; border-left: none; border-bottom: none; }
    .corner-bl, .corner-br { position: absolute; width: 16px; height: 16px; border: 1px solid #c9a961; z-index: 10; pointer-events: none; }
    .corner-bl { bottom: 3px; left: 3px; border-right: none; border-top: none; }
    .corner-br { bottom: 3px; right: 3px; border-left: none; border-top: none; }
    .frame-title {
      position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
      background: #15161c;
      border: 1px solid rgba(201,169,97,.45); border-radius: 4px; padding: 2px 16px;
      color: #c9a961; font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      white-space: nowrap; z-index: 20; text-shadow: 0 0 8px rgba(201,169,97,.35);
    }

    /* Desktop: fixed framed game at the design size (768x672). */
    #game-container { line-height: 0; width: 768px; height: 672px; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

    /* ---- Touch controls: hidden by default, shown only on touch + overworld ---- */
    #touch-controls { display: none; }

    @media (pointer: coarse), (hover: none) {
      /* Full-viewport render layer */
      .frame-wrapper { display: block; width: 100vw; height: 100vh; background: #0a0a14; }
      .rpg-frame { padding: 0; border: none; outline: none; box-shadow: none; background: transparent; }
      .rpg-frame::before, .rpg-frame::after, .corner-bl, .corner-br, .frame-title { display: none; }
      #game-container { position: fixed; top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px); width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); height: calc(100vh - env(safe-area-inset-top, 0px)); z-index: 1; }
      /* Keep the playable camera above the persistent field tabs. At map edges the camera can no
         longer leave the hero hidden behind the DOM navigation bar. */
      body.show-controls #game-container { height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 76px); }
      #game-container canvas { width: 100% !important; height: 100% !important; display: block; }
      /* Hide the Phaser canvas while the DOM overlay is up, so the old Phaser scene UI never
         flashes under it. ui-overhaul.js toggles .qok-overlay in activate/deactivate and ticks
         on Phaser scene events so this flips in sync with the scene change (no 50ms poll gap).
         Scenes WITHOUT a DOM overlay (e.g. boot) keep the canvas visible. */
      body.qok-overlay #game-container { visibility: hidden; }

      /* The control overlay shows only while the game says we're on the overworld. */
      body.show-controls #touch-controls {
        display: block; position: fixed; inset: 0; z-index: 100; pointer-events: none;
      }
      body.qok-dialogue #touch-controls { display: none; }

      /* --- Analog stick (same shape and feel as the town overlay's pad) --- */
      .stick {
        position: absolute; width: 172px; height: 172px; pointer-events: auto;
        touch-action: none; border-radius: 50%;
        background: rgba(21,22,28,.42); border: 1px solid rgba(201,169,97,.45);
        box-shadow: 0 0 12px rgba(0,0,0,.45), inset 0 0 16px rgba(0,0,0,.35);
      }
      .stick-knob {
        position: absolute; left: 50%; top: 50%; width: 70px; height: 70px;
        margin: -35px 0 0 -35px; border-radius: 50%;
        background: rgba(201,169,97,.30); border: 1px solid rgba(201,169,97,.70);
        box-shadow: 0 0 10px rgba(0,0,0,.35);
        transition: transform .04s linear;
      }
      .stick.active .stick-knob { background: rgba(201,169,97,.62); border-color: #c9a961; }

      /* --- Field/dungeon bottom menu tabs (replace the floating menu button). Populated + handled by ui-overhaul.js. --- */
      .field-tabs {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
        display: flex; gap: 4px; pointer-events: auto;
        padding: 7px 8px calc(7px + env(safe-area-inset-bottom, 0px));
        background: #101116;
        border-top: 1px solid rgba(201,169,97,.20);
      }
      .field-tabs .ft {
        flex: 1; min-height: 48px; border: none; background: transparent; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
        color: rgba(232,226,212,.55); font-size: 11px; font-weight: 500; border-radius: 10px;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      }
      /* .tabic itself is defined in ui-overhaul.css -- one definition for both tab bars. */
      .field-tabs .ft .tabic { color: rgba(201,169,97,.60); }
      .field-tabs .ft.pressed { background: rgba(201,169,97,.14); color: #e8e2d4; }
      .field-tabs .ft.pressed .tabic { color: #c9a961; }

      /* --- Orientation: d-pad position (raised to sit above the bottom tab bar) --- */
      .stick { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
      /* LEFT (default): d-pad bottom-left */
      body.ctrl-left  .stick { left:  calc(20px + env(safe-area-inset-left, 0px)); right: auto; }
      /* RIGHT: d-pad bottom-right */
      body.ctrl-right .stick { right: calc(20px + env(safe-area-inset-right, 0px)); left: auto; }
      /* CENTER: d-pad centered */
      body.ctrl-center .stick { left: 50%; right: auto; transform: translateX(-50%); }
    }

    /* ---- Boot cover -------------------------------------------------------------------------
       WHY THIS EXISTS. BootScene.preload() queues 75 monster PNGs with no progress indicator, and
       its "Loading..." text is only created in create() -- i.e. after every one of them has
       already loaded, and it is overwritten with "Ready!" on the very next statement, so it is
       never actually seen. create() then sits on a hardcoded 400 ms setTimeout before starting
       TitleScene. All of that is inside the frozen 4.99 MB bundle and cannot be removed from
       here. What the player got for the whole of it was an unexplained black screen -- owner
       2026-08-07: "i also saw a blank screen ... before the current overworld loaded".

       So the SHELL paints the wait instead of leaving a void: the game's own charcoal and gold,
       its title, and a moving bar that says the wait is intentional. This is the one part of the
       startup the shell still owns, because it is in the HTML itself and therefore on screen from
       the first paint -- before the bundle has even been fetched, let alone parsed.
       Dismissed by the script at the bottom of <body>; see the readiness test there. ---------- */
    #boot-cover {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #141428 0%, #0a0a14 70%);
      opacity: 1; transition: opacity .24s ease-out;
    }
    #boot-cover.gone { opacity: 0; pointer-events: none; }
    .bc-plate {
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      padding: 22px 34px;
      border: 1px solid rgba(201,169,97,.45);
      border-radius: 6px;
      background: #15161c;
      box-shadow: 0 0 30px rgba(80,60,20,.30), 0 6px 22px rgba(0,0,0,.55);
    }
    .bc-title {
      color: #c9a961; font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
      white-space: nowrap; text-shadow: 0 0 8px rgba(201,169,97,.35);
    }
    /* Indeterminate on purpose: the bundle exposes no progress to report, and a fake percentage
       that is not measuring anything is worse than an honest "still working". */
    .bc-bar { width: 168px; height: 2px; background: rgba(201,169,97,.16); overflow: hidden; }
    .bc-bar i { display: block; width: 38%; height: 100%; background: #c9a961; animation: bc-sweep 1.15s ease-in-out infinite; }
    @keyframes bc-sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(363%); } }
    @media (prefers-reduced-motion: reduce) { .bc-bar i { animation: none; width: 100%; opacity: .5; } }
  </style>
  <link rel="stylesheet" href="/ui-overhaul.css" />
  <script type="module" src="/src/main.ts"></script>
</head>
<body class="ctrl-right">
  <!-- Painted before anything else so the shell is never a black void. See #boot-cover above. -->
  <div id="boot-cover"><div class="bc-plate"><span class="bc-title">Quest of Knowledge</span><div class="bc-bar"><i></i></div></div></div>

  <div class="frame-wrapper">
    <div class="rpg-frame">
      <span class="frame-title">Quest of Knowledge</span>
      <div class="corner-bl"></div>
      <div class="corner-br"></div>
      <div id="game-container"></div>
    </div>
  </div>

  <!-- Overworld-only controls. Analog stick, matching the Act 1 town overlay: the knob follows the
       finger and the vector is mapped to arrow keys, so DIAGONALS are possible. The old 4-way
       d-pad held exactly one arrow at a time, which made corner boundaries untestable. -->
  <div id="touch-controls" aria-hidden="true">
    <div class="stick" id="dpad"><div class="stick-knob" id="dpadKnob"></div></div>
    <div class="field-tabs" id="fieldTabs"></div>
  </div>

  <!-- Storybook Quest DOM UI overlay (additive; only shows on recognized scenes) -->
  <div id="qok-ui"></div>
  <script src="/ui-overhaul.js"></script>
  <script src="/act1-world-map.js"></script>
  <script src="/dq-tiles.js"></script>
  <script src="/hero-override.js"></script>
  <script type="module" src="/act1-hifi/adapter.js"></script>

  <script>
    /* ---- The loading cover ---------------------------------------------------------------------
       TWO gates, not one, because the startup has two black holes and the second one is the one
       the owner photographed.

       GATE 1, boot -> title. Not `__PHASER_GAME__` existing: that is true the moment the bundle
       constructs the Game, long before BootScene has loaded anything, so lifting there would only
       move the black screen. Not TitleScene merely being ACTIVE either -- scene.start() queues a
       scene, it does not run it, and on touch the DOM overlay HIDES the canvas outright
       (`body.qok-overlay #game-container { visibility: hidden }` above), so a canvas-only test
       would uncover a deliberately invisible canvas. So: TitleScene active AND whichever surface
       will actually show it has content, held for three consecutive frames.

       GATE 2, title -> world. Owner 2026-08-07, on a device capture taken during this window:
       "the hero is right but the overworld and minimap is wrong. I'd rather have a loading screen
       than to show this stuck old state." The HUD chrome -- HP panel, minimap, compass, tab bar --
       is DOM and arrives immediately and complete, while the terrain, the baked minimap relief and
       the icon mask sheet are all still loading. The result is a confident, finished-looking
       interface framing nothing. So the cover comes back when the world scene starts and does not
       lift until the world is genuinely presentable:

         1. terrain painted        __DQ_TILES__.ready()  -- a terrain window has actually been
                                   drawn, the material art has decoded (not the flat palette
                                   fallback), and inside the Act 1 footprint the baked chunks have
                                   been blitted. Only dq-tiles.js knows this, so it answers it.
         2. minimap is the bake    __QOKUI.mapArtReady()  -- overworld only. The four portal lands
                                   have no baked image by design and legitimately draw the lattice,
                                   so requiring it there would hang the cover forever.
         3. icon sheet decoded     __QOKUI.iconsReady()   -- the tab glyphs are CSS masks, and an
                                   undecoded mask is the bare-text tab bar in the capture.
         4. hero is g3             __HERO_VARIANT__, set by hero-override.js only after the swap
                                   actually succeeded.

       DELIBERATELY NOT GATED ON: the Act 1 hi-fi TOWN overlay (a ~19 MB iframe with its own 30 s
       timeout -- covering that would mean a half-minute cover on every town entry), audio, and
       monster art that is not on screen. And the gate is armed ONCE: after the first world entry
       it is latched off and the node is removed, so this can never reappear over a battle, a menu
       or a dungeon transition. That is a deliberate scope limit, not an oversight -- a cover on
       every map change is a different product decision than the one that was asked for.

       Both caps are safety valves, not tuning: a boot that fails for any reason must end up
       showing the game's own failure, never a cover that hides it forever. */
    (function () {
      var cover = document.getElementById('boot-cover');
      if (!cover) return;
      var TITLE_CAP = 10000, WORLD_CAP = 20000;
      var phase = 'boot', frames = 0, t0 = Date.now(), worldT0 = 0;

      function titlePainted() {
        // The recovery module below is about to press Continue for the player, so the title is a
        // waypoint we pass through, not a screen anyone is meant to see. Lifting the cover here
        // would flash the title for a few frames and then cover it again -- exactly the stutter
        // gate 2 exists to prevent. The flag is cleared the moment recovery lands or gives up,
        // and TITLE_CAP still lifts the cover if it does neither.
        if (window.__QOK_RECOVERING__) return false;
        var g = window.__PHASER_GAME__;
        if (!g || !g.scene || !g.scene.isActive || !g.scene.isActive('TitleScene')) return false;
        if (document.body.classList.contains('qok-overlay')) {
          var stage = document.getElementById('qok-stage');
          return !!(stage && stage.firstChild);
        }
        return true;
      }
      function worldReady() {
        var g = window.__PHASER_GAME__, wm = g.scene.getScene('WorldMapScene');
        if (!wm || !wm.mapData || !wm.mapData.length) return false;
        var dq = window.__DQ_TILES__, ui = window.__QOKUI;
        if (!dq || !dq.ready || !dq.ready()) return false;
        if (!ui || !ui.iconsReady || !ui.iconsReady()) return false;
        if (wm.currentMapId === 'overworld' && !(ui.mapArtReady && ui.mapArtReady())) return false;
        if (!window.__HERO_VARIANT__) return false;
        return true;
      }
      function worldActive() {
        var g = window.__PHASER_GAME__;
        return !!(g && g.scene && g.scene.isActive && g.scene.isActive('WorldMapScene'));
      }
      function show() { cover.classList.remove('gone'); }
      function hide() { cover.classList.add('gone'); }
      function finish() {
        hide();
        setTimeout(function () { if (cover.parentNode) cover.parentNode.removeChild(cover); }, 400);
      }
      function tick() {
        if (phase === 'boot') {
          // A recovery starts the world scene without the title ever being lifted to. Hand
          // straight to gate 2 rather than lifting and immediately re-covering. This cannot fire
          // on a normal boot: reaching the world needs a tap on Continue, and the cover swallows
          // taps until it has already lifted (phase 'waiting').
          if (worldActive()) { worldT0 = Date.now(); phase = 'world'; }
          else {
            frames = titlePainted() ? frames + 1 : 0;
            if (frames >= 3 || Date.now() - t0 > TITLE_CAP) { hide(); phase = 'waiting'; }
          }
        } else if (phase === 'waiting') {
          // Title is up and the player is choosing. Arm gate 2 the moment the world scene starts.
          if (worldActive()) { show(); worldT0 = Date.now(); phase = 'world'; }
        } else if (phase === 'world') {
          if (worldReady() || Date.now() - worldT0 > WORLD_CAP) { finish(); return; }
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
      window.__QOK_COVER__ = { phase: function () { return phase; } };
    })();

    /* ---- The black box -------------------------------------------------------------------------
       WHY THIS EXISTS. Owner, 2026-08-09: "why don't you build in an error message that displays
       depending on the error type on my phone? i can tell you the exact error message so you can
       pinpoint the issue." He is right, and it is the best idea anyone has had about this bug. His
       iPhone 13 is thrown back to the title by something that Apple's crash reports do not see
       (submissions: zero), that the simulator will not reproduce, and that every memory theory has
       failed to explain -- the re-measured encounter peak is 245 -> 296 MB of WebContent, which
       should not kill a 4 GB phone. We cannot read his logs. So the page records what happened to
       it, survives its own death in localStorage, and reads the record back on the next boot.

       WHAT IT IS NOT. It is not a fix and it does not reduce memory by one byte, exactly like the
       recovery net it rides on. It is an instrument, and its most valuable output may well be the
       BORING one: "no error recorded". That answer is not a failure of the instrument, it is a
       finding -- it means the page was executing normally and then simply ceased to exist, which
       rules out every fault that JavaScript can observe and leaves the process being killed from
       outside.

       WHY `webglcontextlost` IS LISTED FIRST. Nobody has checked it. A lost GPU context is not a
       memory jetsam: it fires a real, catchable event, and it would explain a fault that recurs on
       EVERY encounter rather than varying with how long he has been playing -- which is what
       memory pressure would look like. The listener is passive: it does not preventDefault, so
       whatever Phaser does about the loss is unchanged.

       THE COST DISCIPLINE, WHICH IS NOT NEGOTIABLE. The commit before this one took a 2 s
       setInterval out of the walk because it is the last candidate with the right cadence for the
       owner's freezes. Nothing here may put one back. So: breadcrumbs are appended to an in-memory
       ring and are written to storage ONLY on the same scene edges the resume snapshot already
       uses -- and battle start, the moment that matters, is one of them. Errors and context loss
       write immediately because they are rare by definition. There is no timer in this module.
    -------------------------------------------------------------------------------------------- */
    (function () {
      var BB = 'edu-rpg-blackbox';
      var RING = 20;

      /* Breadcrumb codes. Two digits each, because the last two of them become the digits of the
         spoken code below and the owner should be able to read it down a phone line. THIS TABLE IS
         THE ONLY DECODER -- do not copy it into a doc, because a second copy is how a reported
         code ends up being read against the wrong table. Adding a code is fine; RENUMBERING an
         existing one silently invalidates every code already reported, so never do that. */
      var C = {
        BOOT: 1, TITLE: 2, WORLD: 3, MAP: 4, BATTLE: 5, BATTLE_END: 6, MENU: 7,
        SCENE_START: 8, SCENE_STOP: 9, WALK_START: 10, WALK_STOP: 11,
        HIDDEN: 12, VISIBLE: 13, PAGEHIDE: 14, FREEZE: 15, RESUME: 16,
        RECOVERY: 17, GL_LOST: 18, GL_RESTORED: 19, ERROR: 20, REJECT: 21
      };

      var t0 = Date.now();
      var rec = {
        v: 1, t: t0, why: 'boot', gl: null, err: null, rej: null,
        life: [], crumbs: [], ctx: null
      };
      var battleAt = 0;
      // Read the PREVIOUS page's record before anything can overwrite it. This is the whole point:
      // by the time the panel wants it, this page has already started writing its own.
      var prior = null;
      try { prior = JSON.parse(localStorage.getItem(BB) || 'null'); } catch (e) {}

      function G() { return window.__PHASER_GAME__; }
      function crumb(code, detail) {
        rec.crumbs.push([Date.now() - t0, code, detail === undefined ? null : detail]);
        if (rec.crumbs.length > RING) rec.crumbs = rec.crumbs.slice(-RING);
      }
      function context() {
        var out = {};
        try {
          var g = G();
          if (g && g.scene && g.scene.scenes) {
            var live = [];
            for (var i = 0; i < g.scene.scenes.length; i++) {
              var st = g.scene.scenes[i].sys && g.scene.scenes[i].sys.settings;
              if (st && st.active) live.push(st.key);
            }
            out.active = live.join(',');
          }
          // Texture count is the one memory-shaped number WebKit will actually give us.
          // performance.memory is NOT exposed in WebKit and is deliberately not faked here.
          if (g && g.textures && g.textures.list) out.tex = Object.keys(g.textures.list).length;
          var wm = g && g.scene && g.scene.getScene && g.scene.getScene('WorldMapScene');
          if (wm) out.map = wm.currentMapId;
          if (battleAt) out.inBattleMs = Date.now() - battleAt;
          var dq = window.__DQ_TILES__;
          if (dq && dq.readyWhy) out.dq = JSON.stringify(dq.readyWhy()).slice(0, 120);
          var ui = window.__QOKUI;
          if (ui && ui.screen) out.screen = ui.screen();
          if (ui && ui.err) { var e = ui.err(); if (e) out.uiErr = String(e).slice(0, 120); }
          var r = window.__QOK_RECOVERY__;
          if (r && r.report) out.recoveries = r.report().total;
        } catch (e) { out.ctxError = String(e && e.message || e).slice(0, 80); }
        return out;
      }
      function flush(why) {
        try {
          rec.why = why || rec.why;
          rec.t = Date.now();
          rec.ctx = context();
          localStorage.setItem(BB, JSON.stringify(rec));
        } catch (e) {}
      }

      /* ---- the three things that can actually be caught -------------------------------------- */

      // 1. GPU context loss. Passive on purpose: no preventDefault, so Phaser's own handling of a
      //    lost context is exactly what it was. Armed as soon as a canvas exists; the loop is
      //    bounded and stops the moment it lands, so it is boot-time work and nothing else.
      (function armCanvas(deadline) {
        if (!deadline) deadline = Date.now() + 60000;
        var c = document.querySelector('canvas');
        if (c) {
          c.addEventListener('webglcontextlost', function () {
            rec.gl = { t: Date.now() - t0, restored: 0 };
            crumb(C.GL_LOST);
            flush('webglcontextlost');
          }, false);
          c.addEventListener('webglcontextrestored', function () {
            if (rec.gl) rec.gl.restored = 1;
            crumb(C.GL_RESTORED);
            flush('webglcontextrestored');
          }, false);
          return;
        }
        if (Date.now() > deadline) return;
        requestAnimationFrame(function () { armCanvas(deadline); });
      })();

      // 2. Script errors. Both channels, because window.onerror and the capture-phase 'error'
      //    listener do not see the same set: the listener also receives resource load failures,
      //    which arrive with no `message` and are recorded as such rather than being dropped.
      function onErr(msg, src, line, col, err) {
        if (rec.err) return;                       // the FIRST error is the interesting one
        var st = [];
        try {
          if (err && err.stack) st = String(err.stack).split('\n').slice(0, 4).map(function (s) { return s.trim().slice(0, 120); });
        } catch (e) {}
        rec.err = {
          t: Date.now() - t0, m: String(msg == null ? 'unknown' : msg).slice(0, 200),
          s: (src ? String(src).split('/').pop() : '') + (line ? ':' + line + ':' + (col || 0) : ''),
          st: st
        };
        crumb(C.ERROR);
        flush('error');
      }
      window.addEventListener('error', function (e) {
        if (e && e.target && e.target !== window && e.target.tagName) {
          onErr('resource failed to load: ' + e.target.tagName, e.target.src || e.target.href, 0, 0, null);
        } else {
          onErr(e && e.message, e && e.filename, e && e.lineno, e && e.colno, e && e.error);
        }
      }, true);
      var prevOnError = window.onerror;
      window.onerror = function (m, s, l, c2, e) {
        onErr(m, s, l, c2, e);
        if (typeof prevOnError === 'function') return prevOnError.apply(this, arguments);
        return false;
      };
      window.addEventListener('unhandledrejection', function (e) {
        if (rec.rej) return;
        var r = e && e.reason;
        rec.rej = { t: Date.now() - t0, m: String((r && (r.message || r)) || 'unknown').slice(0, 200) };
        crumb(C.REJECT);
        flush('unhandledrejection');
      });

      // 3. Lifecycle. This is what separates "iOS put us in the background" from "we were killed

      window.__QOK_RECOVERY__ = {
        report:    function () { return log(); },
        heartbeat: function () { return rd(HB); },
        snapshot:  function () { return rd(SNAP); },
        // The instrument for "no periodic write while walking". In memory, never stored: sample it
        // before and after a walk and the delta must be zero. `reasons` says which edge fired.
        writes:    function () { return JSON.parse(JSON.stringify(writes)); },
        walking:   function () { return { walking: walking, timerRunning: timer !== null, hooked: hookedTo !== null }; },
        // Deliberately NOT called by anything: clearing the count is a decision, not a step.
        reset:     function () { wr(LOG, { total: 0, blocked: 0, events: [], last: null }); }
      };

      function toast(msg) {
        try {
          var d = document.createElement('div');
          d.setAttribute('data-qok-recovery-toast', '1');
          d.textContent = msg;
          // 108px clears BOTH surfaces it could land on: the field tab bar (~92pt tall) and the
          // title screen's EN/JA toggle. Measured on the simulator at 18px, where it sat on top
          // of "Items" / "Equip" in the field and over the language toggle on the title.
          d.style.cssText = 'position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 108px);' +
            'transform:translateX(-50%);z-index:10000;pointer-events:none;max-width:86vw;text-align:center;' +
            'padding:9px 15px;border:1px solid rgba(201,169,97,.5);border-radius:5px;background:rgba(21,22,28,.94);' +
            'color:#c9a961;font-size:12px;line-height:1.45;letter-spacing:.4px;box-shadow:0 4px 18px rgba(0,0,0,.55);' +
            'opacity:0;transition:opacity .3s ease-out;';
          document.body.appendChild(d);
          requestAnimationFrame(function () { d.style.opacity = '1'; });
          setTimeout(function () {
            d.style.opacity = '0';
            setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 400);
          }, 4200);
        } catch (e) {}
      }
      /* Three strings per message, exactly as the bundle carries them: English, Japanese, and the
         kanji variant. The toast lives outside the bundle's i18n table (it must be able to speak
         before the game has loaded anything), so it reads the locale from the game's own
         `edu-rpg-locale` key and the kanji flag off the resume snapshot. */
      function say(m) {
        var loc = 'ja';
        try { if (localStorage.getItem('edu-rpg-locale') === 'en') loc = 'en'; } catch (e) {}
        if (loc === 'en') return m.en;
        var kanji = false;
        try { kanji = !!(snap && snap.player && snap.player.kanjiMode); } catch (e) {}
        return kanji ? m.jaKanji : m.ja;
      }
      var MSG_RECOVERED = {
        en: 'Recovered from an interruption.',
        ja: 'ちゅうだんした ところから 再開しました。',
        jaKanji: '中断した ところから 再開しました。'
      };
      /* ---- the black box's report ------------------------------------------------------------
         A PANEL, not a toast, because the owner has to be able to read it out or photograph it --
         a message that fades in four seconds is no use to someone reaching for a phone camera. It
         leads with the classification in plain words, because that is the sentence he will relay,
         and it carries a short spoken code so he never has to read a stack trace aloud.
         Dismissable, and it does not block play: the map is live behind it and the field controls
         are outside it, so he can walk away without touching it. */
      var MSG_CLASS = {
        gl: { en: 'Graphics context was lost.',
              ja: 'グラフィックの せつぞくが きれました。',
              jaKanji: 'グラフィックの 接続が 切れました。' },
        js: { en: 'Script error.',
              ja: 'スクリプトエラーが おきました。',
              jaKanji: 'スクリプトエラーが 起きました。' },
        pr: { en: 'A background task failed.',
              ja: 'ないぶしょりが しっぱいしました。',
              jaKanji: '内部処理が 失敗しました。' },
        bg: { en: 'The app was sent to the background first.',
              ja: 'さきに アプリが バックグラウンドに なりました。',
              jaKanji: '先に アプリが バックグラウンドに なりました。' },
        kl: { en: 'No error recorded. The page was killed outright.',
              ja: 'エラーは きろくされていません。ページが とつぜん おわりました。',
              jaKanji: 'エラーは 記録されていません。ページが 突然 終わりました。' }
      };
      var MSG_CLOSE = { en: 'Close', ja: 'とじる', jaKanji: '閉じる' };
      var MSG_TELL  = { en: 'Please read this code out.',
                        ja: 'この コードを おしえてください。',
                        jaKanji: 'この コードを 教えてください。' };

      function panel(cls) {
        var d = document.createElement('div');
        d.setAttribute('data-qok-blackbox-panel', '1');
        d.style.cssText = 'position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);' +
          'transform:translateX(-50%);z-index:10001;width:min(340px,92vw);box-sizing:border-box;' +
          'padding:14px 16px 12px;border:1px solid rgba(201,169,97,.55);border-radius:7px;' +
          'background:rgba(21,22,28,.97);color:#e8e2d4;font-size:12px;line-height:1.5;' +
          'box-shadow:0 6px 24px rgba(0,0,0,.65);opacity:0;transition:opacity .3s ease-out;';
        var add = function (html, css) {
          var e = document.createElement('div');
          e.style.cssText = css || '';
          e.textContent = html;
          d.appendChild(e);
          return e;
        };
        add(say(MSG_RECOVERED), 'color:#c9a961;font-size:12px;margin-bottom:8px;');
        add(say(MSG_CLASS[cls.key] || MSG_CLASS.kl), 'font-size:13px;font-weight:500;margin-bottom:10px;');
        add(say(MSG_TELL), 'color:rgba(232,226,212,.6);font-size:11px;');
        // The code, big and spaced, because this is the one line he has to get right by voice.
        add(cls.code, 'font-size:22px;letter-spacing:2px;color:#c9a961;margin:2px 0 10px;' +
          'font-family:ui-monospace,SFMono-Regular,Menlo,monospace;');
        // The detail, small. Truncated hard: this is a phone, not a log viewer.
        var p = cls.rec || {}, det = [];
        if (p.err) det.push(p.err.m + (p.err.s ? '  (' + p.err.s + ')' : ''));
        if (p.rej) det.push(p.rej.m);
        if (p.gl) det.push('gl lost at ' + p.gl.t + 'ms, restored=' + p.gl.restored);
        if (p.ctx) {
          if (typeof p.ctx.inBattleMs === 'number') det.push('in battle ' + p.ctx.inBattleMs + 'ms');
          if (p.ctx.map) det.push('map ' + p.ctx.map);
          if (p.ctx.active) det.push('scenes ' + p.ctx.active);
          if (typeof p.ctx.tex === 'number') det.push('textures ' + p.ctx.tex);
        }
        var tail = (p.crumbs || []).slice(-6).map(function (c) { return c[1]; }).join('>');
        if (tail) det.push('trail ' + tail);
        if (det.length) {
          add(det.join('\n'), 'white-space:pre-wrap;word-break:break-word;color:rgba(232,226,212,.62);' +
            'font-size:10.5px;line-height:1.45;max-height:132px;overflow:auto;' +
            'border-top:1px solid rgba(201,169,97,.22);padding-top:8px;');
        }
        var b = document.createElement('button');
        b.textContent = say(MSG_CLOSE);
        b.style.cssText = 'display:block;margin:10px 0 0 auto;padding:7px 16px;min-height:34px;' +
          'border:1px solid rgba(201,169,97,.5);border-radius:5px;background:transparent;' +
          'color:#c9a961;font:inherit;font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;';
        b.addEventListener('click', function () { if (d.parentNode) d.parentNode.removeChild(d); });
        d.appendChild(b);
        document.body.appendChild(d);
        requestAnimationFrame(function () { d.style.opacity = '1'; });
      }
      // The panel is the richer form of the recovery message; the toast is what we fall back to if
      // the black box is missing or anything in the panel throws. One of the two always appears,
      // because that message is what tells the owner a recovery happened rather than a stutter.
      function report() {
        try {
          var b = BB();
          var cls = b && b.classify ? b.classify() : null;
          if (cls) { panel(cls); return; }
        } catch (e) { console.warn('[QOK-RECOVERY] panel failed:', e); }
        toast(say(MSG_RECOVERED));
      }

      var MSG_BLOCKED = {
        en: 'Repeated restarts. Auto-resume paused, tap Continue.',
        ja: 'さいきどうが つづいたため 自動復帰を 止めました。「つづきから」を えらんでください。',
        jaKanji: '再起動が 続いたため 自動復帰を 止めました。「続きから」を えらんでください。'
      };

      /* ---- the decision, taken once, synchronously, at page start -------------------------- */
      var now  = Date.now();
      var hb   = rd(HB);
      var snap = rd(SNAP);

      // A restart, not a launch: something was alive, in a playthrough, in the foreground, within
      // the freshness window -- and this is a brand new page. Anything older is an ordinary cold
      // start and is left completely alone.
      //
      // TWO windows, because the beacon has two cadences by design. A beacon stamped while the
      // hero was STANDING is at most IDLE_MS (2 s) old, so FRESH_MS (20 s) has 18 s of slack and
      // is unchanged. A beacon stamped `mv:1` was the last thing written before the timer was
      // stopped for a walk, so its age is the length of the walk and there is no upper bound on
      // that from inside the page. FRESH_WALK_MS caps how long we will believe it; past that he
      // gets the title, i.e. the pre-net behaviour. The `vis` test -- the thing that actually
      // separates a kill from a force-quit -- is identical in both cases.
      var beaconAge = hb ? now - hb.t : Infinity;
      var freshWindow = hb && hb.mv === 1 ? FRESH_WALK_MS : FRESH_MS;
      var restarted = !!(hb && hb.live === 1 && hb.vis === 1 &&
                         beaconAge >= 0 && beaconAge < freshWindow);

      var p = snap && snap.player;
      var usable = !!(p && p.position && typeof p.position.mapId === 'string' && p.position.mapId &&
                      typeof p.position.x === 'number' && typeof p.position.y === 'number' &&
                      typeof p.hp === 'number' && p.hp > 0 && typeof p.level === 'number');

      if (restarted && usable) {
        var l = log();
        l.events = l.events.filter(function (t) { return now - t < GUARD_SLOW_MS; });
        var fast = l.events.filter(function (t) { return now - t < GUARD_FAST_MS; }).length;
        var slow = l.events.length;
        var looping = fast >= GUARD_FAST_N || slow >= GUARD_SLOW_N;

        if (looping) {
          /* THE LOOP GUARD. Kill -> restore -> kill again is strictly worse than the bug it is
             covering: today he at least reaches the title and can play on, whereas a cycle offers
             him no screen that stays up long enough to act on. The restore point is an OVERWORLD
             POSITION, so if whatever kills the process re-fires where he is standing, the cycle is
             the LIKELY outcome, not a corner case. So recovery stands down and hands him the title
             deliberately, with a message. It re-arms by itself as the events age out of the
             windows -- nobody has to reset anything. Tripping early is cheap: the fallback IS
             today's behaviour, plus an explanation. Failing to trip is not cheap at all. */
          l.blocked = (l.blocked || 0) + 1;
          wr(LOG, l);
          console.warn('[QOK-RECOVERY] STOOD DOWN: ' + fast + ' recoveries in ' + (GUARD_FAST_MS / 1000) +
            's / ' + slow + ' in ' + (GUARD_SLOW_MS / 1000) + 's looks like a restart loop. ' +
            'Falling back to the title screen. blocked=' + l.blocked + ' total=' + l.total);
          setTimeout(function () { toast(say(MSG_BLOCKED)); }, 1200);
        } else {
          // Counted BEFORE the attempt, on purpose: a recovery that itself dies must still count
          // towards the guard, or a crash inside recovery becomes an uncounted infinite loop.
          l.total = (l.total || 0) + 1;
          l.events.push(now);
          if (l.events.length > 50) l.events = l.events.slice(-50);
          // `mv` and `windowMs` are here so a stale-looking restore point can be explained rather
          // than guessed at: mv:1 means the beacon aged for the length of an uninterrupted walk.
          l.last = { t: now, mapId: p.position.mapId, floor: p.position.floor || 1,
                     x: p.position.x, y: p.position.y, hp: p.hp, beaconAgeMs: beaconAge,
                     mv: hb.mv === 1 ? 1 : 0, windowMs: freshWindow };
          wr(LOG, l);
          console.warn('[QOK-RECOVERY] restart detected (beacon ' + beaconAge + 'ms old, mv=' +
            (hb.mv === 1 ? 1 : 0) + ', window ' + freshWindow + 'ms). ' +
            'Restoring #' + l.total + ' to ' + p.position.mapId + ' floor ' + (p.position.floor || 1) +
            ' at ' + p.position.x + ',' + p.position.y + ' hp=' + p.hp + '. ' +
            'THIS IS A SAFETY NET, NOT A FIX -- the memory defect that caused the restart is unchanged.');

          window.__QOK_RECOVERING__ = 1;
          var deadline = now + GIVE_UP_MS;

          var attempt = function () {
            var g = G(), s = S();
            if (!g || !s || !g.scene || !g.scene.getScene) return false;
            var ts = g.scene.getScene('TitleScene');
            if (!ts || !act('TitleScene') || ts.mode !== 'title' || !ts.menuItems) return false;

            // No manual save at all: this run never reached a save point, so the resume snapshot
            // is the ONLY copy of it and the empty slot has nothing to lose. Seeding it is the
            // only way to reach the shipped loader, and it destroys nothing. Where a manual save
            // DOES exist it is never written -- clobbering a save-point save (full HP, by
            // definition) with a mid-field state could hand him a 3 HP death loop.
            var seeded = false;
            try {
              if (!localStorage.getItem('edu-rpg-save')) {
                localStorage.setItem('edu-rpg-save', JSON.stringify(snap));
                seeded = true;
                ts.draw();   // rebuilds menuItems so the Continue entry exists
              }
            } catch (e) {}

            var idx = -1, i;
            for (i = 0; i < ts.menuItems.length; i++) {
              if (ts.menuItems[i] && ts.menuItems[i].getData && ts.menuItems[i].getData('action') === 'continue') { idx = i; break; }
            }
            if (idx < 0) return false;

            var orig = s.loadGame, loaded = false;
            s.loadGame = function () {
              s.loadGame = orig;                       // one shot, released before anything can throw
              var ok = orig.call(s);
              loaded = !!ok;
              /* The restore point is the spot he was standing on when the process died, and a
                 random encounter there is what most plausibly kills it again. loadGame builds a
                 fresh EncounterManager, so `stepsSinceLastEncounter` is already 0 and the zone's
                 own `minStepsBetween` applies -- but that is the ordinary post-battle grace, not
                 a margin. Starting it NEGATIVE buys GRACE_STEPS more steps on top, enough to walk
                 away from the spot. It costs a handful of encounter-free steps once per kill; the
                 loop guard is the backstop, this is the thing that stops us needing it. */
              if (ok && s.encounterManager && typeof s.encounterManager.stepsSinceLastEncounter === 'number') {
                s.encounterManager.stepsSinceLastEncounter = -GRACE_STEPS;
              }
              if (ok && !seeded) {
                try {
                  // Exactly what loadGame itself does with a save's player blob, but with the
                  // fresher one. Everything else loadGame set up -- locale, kanji mode, audio
                  // settings, quiz/encounter/quest managers -- is already correct and untouched.
                  s.player = new (s.player.constructor)(snap.player);
                  if (snap.quizStats && s.quizManager && s.quizManager.loadStats) s.quizManager.loadStats(snap.quizStats);
                  if (typeof snap.playtime === 'number') { s.playtime = snap.playtime; s.startTime = Date.now(); }
                } catch (e) {
                  console.warn('[QOK-RECOVERY] snapshot overlay failed, falling back to the save point:', e);
                }
              }
              return ok;
            };
            try {
              ts.selectedIndex = idx;
              if (ts.updateSelection) ts.updateSelection();
              ts.confirm();
            } finally {
              s.loadGame = orig;
            }
            // confirmTitle() calls scene.start('WorldMapScene') in the same expression as
            // loadGame(), so a true return IS the proof the world was started. Testing
            // isActive('WorldMapScene') here would be wrong: Phaser may queue the start.
            return loaded;
          };

          var poll = function () {
            var done = false;
            try { done = attempt(); } catch (e) {
              console.warn('[QOK-RECOVERY] attempt threw; leaving the player on the title:', e);
              done = true;
            }
            if (done) {
              window.__QOK_RECOVERING__ = 0;
              bbCrumb(17);
              report();
              return;
            }
            if (Date.now() > deadline) {
              // Safety valve. A recovery that cannot land must never hold the cover down; the
              // player gets the ordinary title screen, which is exactly today's behaviour.
              window.__QOK_RECOVERING__ = 0;
              console.warn('[QOK-RECOVERY] gave up after ' + GIVE_UP_MS + 'ms; showing the title.');
              return;
            }
            requestAnimationFrame(poll);
          };
          requestAnimationFrame(poll);
        }
      }
    })();

    (function () {
      var KEYCODE = { ArrowUp: 38, ArrowDown: 40, ArrowLeft: 37, ArrowRight: 39, Escape: 27 };
      var CODE    = { ArrowUp: 'ArrowUp', ArrowDown: 'ArrowDown', ArrowLeft: 'ArrowLeft', ArrowRight: 'ArrowRight', Escape: 'Escape' };
      function fire(type, key) {
        var kc = KEYCODE[key];
        var ev = new KeyboardEvent(type, { key: key, code: CODE[key], bubbles: true, cancelable: true });
        try {
          Object.defineProperty(ev, 'keyCode', { get: function () { return kc; } });
          Object.defineProperty(ev, 'which',   { get: function () { return kc; } });
        } catch (e) {}
        window.dispatchEvent(ev);
      }
      var held = {};
      function press(key)   { if (held[key]) return; held[key] = true; fire('keydown', key); }
      function release(key) { if (!held[key]) return; held[key] = false; fire('keyup', key); }

      /* ---- Analog stick ----
         The engine reads Phaser cursor keys, so the stick still speaks arrow keys -- but it can
         hold TWO at once. The old d-pad picked whichever axis dominated and released the other,
         so a diagonal was impossible and a corner boundary could never be probed. */
      var dpad = document.getElementById('dpad');
      var knob = document.getElementById('dpadKnob');
      var DIRS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
      var activeDir = null;                        // kept: other code reads it
      // 0.38 of full deflection before an axis engages. Low enough that a deliberate diagonal
      // registers on both axes, high enough that a straight push does not wobble into one.
      var AXIS_ON = 0.38;
      /* The stick's RAW vector, published alongside the synthesised keys.
         2026-08-05: the Act 1 dungeon floors moved to continuous movement against a collision
         shape derived from the art, and a direction quantised to four arrow keys cannot drive
         that -- it can only ever produce the eight headings the old d-pad had. The key events
         stay exactly as they were, so the overworld and the towns (which read Phaser cursors)
         are untouched; dq-tiles.js reads this extra channel only where it has a mask. */
      function publishStick(nx, ny, mag) {
        window.__DQ_STICK__ = { x: nx, y: ny, m: mag };
      }
      function setVector(nx, ny, mag) {
        var want = {};
        if (nx >  AXIS_ON) want.ArrowRight = 1; else if (nx < -AXIS_ON) want.ArrowLeft = 1;
        if (ny >  AXIS_ON) want.ArrowDown  = 1; else if (ny < -AXIS_ON) want.ArrowUp   = 1;
        for (var i = 0; i < DIRS.length; i++) {
          var k = DIRS[i];
          if (want[k]) press(k); else release(k);
        }
        activeDir = want.ArrowUp ? 'ArrowUp' : want.ArrowDown ? 'ArrowDown'
                  : want.ArrowLeft ? 'ArrowLeft' : want.ArrowRight ? 'ArrowRight' : null;
        dpad.classList.toggle('active', !!activeDir);
        publishStick(nx, ny, mag || 0);
      }
      function moveKnob(clientX, clientY) {
        var r = dpad.getBoundingClientRect();
        var dx = clientX - (r.left + r.width / 2);
        var dy = clientY - (r.top + r.height / 2);
        var len = Math.hypot(dx, dy), max = r.width / 2 - 22;
        var k = len > max ? max / len : 1;
        knob.style.transform = 'translate(' + (dx * k) + 'px,' + (dy * k) + 'px)';
        if (len < 8) { setVector(0, 0, 0); return; }
        setVector(dx / len, dy / len, Math.min(1, len / max));
      }
      function setDir(dir) {                       // kept for blur/visibility teardown
        if (dir === null) {
          for (var i = 0; i < DIRS.length; i++) release(DIRS[i]);
          activeDir = null; knob.style.transform = ''; dpad.classList.remove('active');
          publishStick(0, 0, 0);
        }
      }
      publishStick(0, 0, 0);
      var dpadTouchId = null;
      dpad.addEventListener('touchstart', function (e) {
        if (e.cancelable) e.preventDefault();
        var t = e.changedTouches[0];
        dpadTouchId = t.identifier;
        moveKnob(t.clientX, t.clientY);
      }, { passive: false });
      dpad.addEventListener('touchmove', function (e) {
        if (e.cancelable) e.preventDefault();
        for (var i = 0; i < e.changedTouches.length; i++) {
          var t = e.changedTouches[i];
          if (t.identifier === dpadTouchId) moveKnob(t.clientX, t.clientY);
        }
      }, { passive: false });
      function dpadEnd(e) {
        for (var i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === dpadTouchId) { dpadTouchId = null; setDir(null); }
        }
      }
      dpad.addEventListener('touchend', dpadEnd);
      dpad.addEventListener('touchcancel', dpadEnd);
      // Mouse fallback (desktop / simulator clicks)
      var dpadMouse = false;
      dpad.addEventListener('mousedown', function (e) { e.preventDefault(); dpadMouse = true; moveKnob(e.clientX, e.clientY); });
      window.addEventListener('mousemove', function (e) { if (dpadMouse) moveKnob(e.clientX, e.clientY); });
      window.addEventListener('mouseup', function () { if (dpadMouse) { dpadMouse = false; setDir(null); } });

      /* ---- The bottom field tabs (open the menu to a tab) are populated + handled by ui-overhaul.js (it has i18n + icons). No floating menu button anymore. ---- */

      // Safety: release movement if the page loses focus / visibility.
      window.addEventListener('blur', function () { for (var k in held) if (held[k]) release(k); setDir(null); });
      document.addEventListener('visibilitychange', function () { if (document.hidden) { for (var k in held) if (held[k]) release(k); setDir(null); } });

      /* ---- Control orientation (left / center / right), persisted by the in-game setting ---- */
      function applyOrientation(v) {
        v = (v === 'right' || v === 'center') ? v : 'left';
        document.body.classList.remove('ctrl-left', 'ctrl-right', 'ctrl-center');
        document.body.classList.add('ctrl-' + v);
      }
      window.__setControlOrientation = function (v) {
        try { localStorage.setItem('eduControlOrientation', v); } catch (e) {}
        applyOrientation(v);
      };
      var savedOri = null;
      try { savedOri = localStorage.getItem('eduControlOrientation'); } catch (e) {}
      applyOrientation(savedOri || 'right'); /* default RIGHT (most users are right-handed) */

      /* ---- Orientation/rotation: force Phaser to re-read the full-viewport size. ---- */
      function refreshScale() {
        var g = window.__PHASER_GAME__;
        if (g && g.scale && g.scale.refresh) { try { g.scale.refresh(); } catch (e) {} }
      }
      function onOrient() { setTimeout(refreshScale, 60); setTimeout(refreshScale, 400); }
      window.addEventListener('orientationchange', onOrient);
      new MutationObserver(function (records) {
        for (var i = 0; i < records.length; i++) if (records[i].attributeName === 'class') { setTimeout(refreshScale, 0); break; }
      }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
    })();
  </script>
</body>
</html>
