<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Quest of Knowledge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0a0a14;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Same bundled face as #qok-ui and the field HUD. ui-overhaul.css declares the
         @font-face and is linked BELOW this block; @font-face is document-scoped, so the
         order does not matter. */
      font-family: 'Zen Maru Gothic', 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Full-page flex centering (desktop framed layout) */
    .frame-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #141428 0%, #0a0a14 70%);
    }

    /* Ornate RPG frame (desktop) */
    .rpg-frame {
      position: relative;
      padding: 12px;
      border: 1px solid rgba(201,169,97,.45);
      outline: 2px solid #3a2f1e;
      outline-offset: 2px;
      background: #111;
      box-shadow: inset 0 0 20px rgba(0,0,0,.8), 0 0 30px rgba(80,60,20,.3), 0 0 60px rgba(0,0,0,.5);
    }
    .rpg-frame::before, .rpg-frame::after {
      content: ''; position: absolute; width: 16px; height: 16px; border: 1px solid #c9a961; z-index: 10;
    }
    .rpg-frame::before { top: 3px; left: 3px; border-right: none; border-bottom: none; }
    .rpg-frame::after { top: 3px; right: 3px; border-left: none; border-bottom: none; }
    .corner-bl, .corner-br { position: absolute; width: 16px; height: 16px; border: 1px solid #c9a961; z-index: 10; pointer-events: none; }
    .corner-bl { bottom: 3px; left: 3px; border-right: none; border-top: none; }
    .corner-br { bottom: 3px; right: 3px; border-left: none; border-top: none; }
    .frame-title {
      position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
      background: #15161c;
      border: 1px solid rgba(201,169,97,.45); border-radius: 4px; padding: 2px 16px;
      color: #c9a961; font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      white-space: nowrap; z-index: 20; text-shadow: 0 0 8px rgba(201,169,97,.35);
    }

    /* Desktop: fixed framed game at the design size (768x672). */
    #game-container { line-height: 0; width: 768px; height: 672px; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

    /* ---- Touch controls: hidden by default, shown only on touch + overworld ---- */
    #touch-controls { display: none; }

    @media (pointer: coarse), (hover: none) {
      /* Full-viewport render layer */
      .frame-wrapper { display: block; width: 100vw; height: 100vh; background: #0a0a14; }
      .rpg-frame { padding: 0; border: none; outline: none; box-shadow: none; background: transparent; }
      .rpg-frame::before, .rpg-frame::after, .corner-bl, .corner-br, .frame-title { display: none; }
      #game-container { position: fixed; top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px); width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); height: calc(100vh - env(safe-area-inset-top, 0px)); z-index: 1; }
      /* Keep the playable camera above the persistent field tabs. At map edges the camera can no
         longer leave the hero hidden behind the DOM navigation bar. */
      body.show-controls #game-container { height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 76px); }
      #game-container canvas { width: 100% !important; height: 100% !important; display: block; }
      /* Hide the Phaser canvas while the DOM overlay is up, so the old Phaser scene UI never
         flashes under it. ui-overhaul.js toggles .qok-overlay in activate/deactivate and ticks
         on Phaser scene events so this flips in sync with the scene change (no 50ms poll gap).
         Scenes WITHOUT a DOM overlay (e.g. boot) keep the canvas visible. */
      body.qok-overlay #game-container { visibility: hidden; }

      /* The control overlay shows only while the game says we're on the overworld. */
      body.show-controls #touch-controls {
        display: block; position: fixed; inset: 0; z-index: 100; pointer-events: none;
      }
      body.qok-dialogue #touch-controls { display: none; }

      /* --- Analog stick (same shape and feel as the town overlay's pad) --- */
      .stick {
        position: absolute; width: 172px; height: 172px; pointer-events: auto;
        touch-action: none; border-radius: 50%;
        background: rgba(21,22,28,.42); border: 1px solid rgba(201,169,97,.45);
        box-shadow: 0 0 12px rgba(0,0,0,.45), inset 0 0 16px rgba(0,0,0,.35);
      }
      .stick-knob {
        position: absolute; left: 50%; top: 50%; width: 70px; height: 70px;
        margin: -35px 0 0 -35px; border-radius: 50%;
        background: rgba(201,169,97,.30); border: 1px solid rgba(201,169,97,.70);
        box-shadow: 0 0 10px rgba(0,0,0,.35);
        transition: transform .04s linear;
      }
      .stick.active .stick-knob { background: rgba(201,169,97,.62); border-color: #c9a961; }

      /* --- Field/dungeon bottom menu tabs (replace the floating menu button). Populated + handled by ui-overhaul.js. --- */
      .field-tabs {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
        display: flex; gap: 4px; pointer-events: auto;
        padding: 7px 8px calc(7px + env(safe-area-inset-bottom, 0px));
        background: #101116;
        border-top: 1px solid rgba(201,169,97,.20);
      }
      .field-tabs .ft {
        flex: 1; min-height: 48px; border: none; background: transparent; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
        color: rgba(232,226,212,.55); font-size: 11px; font-weight: 500; border-radius: 10px;
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      }
      /* .tabic itself is defined in ui-overhaul.css -- one definition for both tab bars. */
      .field-tabs .ft .tabic { color: rgba(201,169,97,.60); }
      .field-tabs .ft.pressed { background: rgba(201,169,97,.14); color: #e8e2d4; }
      .field-tabs .ft.pressed .tabic { color: #c9a961; }

      /* --- Orientation: d-pad position (raised to sit above the bottom tab bar) --- */
      .stick { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
      /* LEFT (default): d-pad bottom-left */
      body.ctrl-left  .stick { left:  calc(20px + env(safe-area-inset-left, 0px)); right: auto; }
      /* RIGHT: d-pad bottom-right */
      body.ctrl-right .stick { right: calc(20px + env(safe-area-inset-right, 0px)); left: auto; }
      /* CENTER: d-pad centered */
      body.ctrl-center .stick { left: 50%; right: auto; transform: translateX(-50%); }
    }
  </style>
  <link rel="stylesheet" href="/ui-overhaul.css" />
  <script type="module" src="/src/main.ts"></script>
</head>
<body class="ctrl-right">
  <div class="frame-wrapper">
    <div class="rpg-frame">
      <span class="frame-title">Quest of Knowledge</span>
      <div class="corner-bl"></div>
      <div class="corner-br"></div>
      <div id="game-container"></div>
    </div>
  </div>

  <!-- Overworld-only controls. Analog stick, matching the Act 1 town overlay: the knob follows the
       finger and the vector is mapped to arrow keys, so DIAGONALS are possible. The old 4-way
       d-pad held exactly one arrow at a time, which made corner boundaries untestable. -->
  <div id="touch-controls" aria-hidden="true">
    <div class="stick" id="dpad"><div class="stick-knob" id="dpadKnob"></div></div>
    <div class="field-tabs" id="fieldTabs"></div>
  </div>

  <!-- Storybook Quest DOM UI overlay (additive; only shows on recognized scenes) -->
  <div id="qok-ui"></div>
  <script src="/ui-overhaul.js"></script>
  <script src="/act1-world-map.js"></script>
  <script src="/dq-tiles.js"></script>
  <script src="/hero-override.js"></script>
  <script type="module" src="/act1-hifi/adapter.js"></script>

  <script>
    (function () {
      var KEYCODE = { ArrowUp: 38, ArrowDown: 40, ArrowLeft: 37, ArrowRight: 39, Escape: 27 };
      var CODE    = { ArrowUp: 'ArrowUp', ArrowDown: 'ArrowDown', ArrowLeft: 'ArrowLeft', ArrowRight: 'ArrowRight', Escape: 'Escape' };
      function fire(type, key) {
        var kc = KEYCODE[key];
        var ev = new KeyboardEvent(type, { key: key, code: CODE[key], bubbles: true, cancelable: true });
        try {
          Object.defineProperty(ev, 'keyCode', { get: function () { return kc; } });
          Object.defineProperty(ev, 'which',   { get: function () { return kc; } });
        } catch (e) {}
        window.dispatchEvent(ev);
      }
      var held = {};
      function press(key)   { if (held[key]) return; held[key] = true; fire('keydown', key); }
      function release(key) { if (!held[key]) return; held[key] = false; fire('keyup', key); }

      /* ---- Analog stick ----
         The engine reads Phaser cursor keys, so the stick still speaks arrow keys -- but it can
         hold TWO at once. The old d-pad picked whichever axis dominated and released the other,
         so a diagonal was impossible and a corner boundary could never be probed. */
      var dpad = document.getElementById('dpad');
      var knob = document.getElementById('dpadKnob');
      var DIRS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
      var activeDir = null;                        // kept: other code reads it
      // 0.38 of full deflection before an axis engages. Low enough that a deliberate diagonal
      // registers on both axes, high enough that a straight push does not wobble into one.
      var AXIS_ON = 0.38;
      /* The stick's RAW vector, published alongside the synthesised keys.
         2026-08-05: the Act 1 dungeon floors moved to continuous movement against a collision
         shape derived from the art, and a direction quantised to four arrow keys cannot drive
         that -- it can only ever produce the eight headings the old d-pad had. The key events
         stay exactly as they were, so the overworld and the towns (which read Phaser cursors)
         are untouched; dq-tiles.js reads this extra channel only where it has a mask. */
      function publishStick(nx, ny, mag) {
        window.__DQ_STICK__ = { x: nx, y: ny, m: mag };
      }
      function setVector(nx, ny, mag) {
        var want = {};
        if (nx >  AXIS_ON) want.ArrowRight = 1; else if (nx < -AXIS_ON) want.ArrowLeft = 1;
        if (ny >  AXIS_ON) want.ArrowDown  = 1; else if (ny < -AXIS_ON) want.ArrowUp   = 1;
        for (var i = 0; i < DIRS.length; i++) {
          var k = DIRS[i];
          if (want[k]) press(k); else release(k);
        }
        activeDir = want.ArrowUp ? 'ArrowUp' : want.ArrowDown ? 'ArrowDown'
                  : want.ArrowLeft ? 'ArrowLeft' : want.ArrowRight ? 'ArrowRight' : null;
        dpad.classList.toggle('active', !!activeDir);
        publishStick(nx, ny, mag || 0);
      }
      function moveKnob(clientX, clientY) {
        var r = dpad.getBoundingClientRect();
        var dx = clientX - (r.left + r.width / 2);
        var dy = clientY - (r.top + r.height / 2);
        var len = Math.hypot(dx, dy), max = r.width / 2 - 22;
        var k = len > max ? max / len : 1;
        knob.style.transform = 'translate(' + (dx * k) + 'px,' + (dy * k) + 'px)';
        if (len < 8) { setVector(0, 0, 0); return; }
        setVector(dx / len, dy / len, Math.min(1, len / max));
      }
      function setDir(dir) {                       // kept for blur/visibility teardown
        if (dir === null) {
          for (var i = 0; i < DIRS.length; i++) release(DIRS[i]);
          activeDir = null; knob.style.transform = ''; dpad.classList.remove('active');
          publishStick(0, 0, 0);
        }
      }
      publishStick(0, 0, 0);
      var dpadTouchId = null;
      dpad.addEventListener('touchstart', function (e) {
        if (e.cancelable) e.preventDefault();
        var t = e.changedTouches[0];
        dpadTouchId = t.identifier;
        moveKnob(t.clientX, t.clientY);
      }, { passive: false });
      dpad.addEventListener('touchmove', function (e) {
        if (e.cancelable) e.preventDefault();
        for (var i = 0; i < e.changedTouches.length; i++) {
          var t = e.changedTouches[i];
          if (t.identifier === dpadTouchId) moveKnob(t.clientX, t.clientY);
        }
      }, { passive: false });
      function dpadEnd(e) {
        for (var i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === dpadTouchId) { dpadTouchId = null; setDir(null); }
        }
      }
      dpad.addEventListener('touchend', dpadEnd);
      dpad.addEventListener('touchcancel', dpadEnd);
      // Mouse fallback (desktop / simulator clicks)
      var dpadMouse = false;
      dpad.addEventListener('mousedown', function (e) { e.preventDefault(); dpadMouse = true; moveKnob(e.clientX, e.clientY); });
      window.addEventListener('mousemove', function (e) { if (dpadMouse) moveKnob(e.clientX, e.clientY); });
      window.addEventListener('mouseup', function () { if (dpadMouse) { dpadMouse = false; setDir(null); } });

      /* ---- The bottom field tabs (open the menu to a tab) are populated + handled by ui-overhaul.js (it has i18n + icons). No floating menu button anymore. ---- */

      // Safety: release movement if the page loses focus / visibility.
      window.addEventListener('blur', function () { for (var k in held) if (held[k]) release(k); setDir(null); });
      document.addEventListener('visibilitychange', function () { if (document.hidden) { for (var k in held) if (held[k]) release(k); setDir(null); } });

      /* ---- Control orientation (left / center / right), persisted by the in-game setting ---- */
      function applyOrientation(v) {
        v = (v === 'right' || v === 'center') ? v : 'left';
        document.body.classList.remove('ctrl-left', 'ctrl-right', 'ctrl-center');
        document.body.classList.add('ctrl-' + v);
      }
      window.__setControlOrientation = function (v) {
        try { localStorage.setItem('eduControlOrientation', v); } catch (e) {}
        applyOrientation(v);
      };
      var savedOri = null;
      try { savedOri = localStorage.getItem('eduControlOrientation'); } catch (e) {}
      applyOrientation(savedOri || 'right'); /* default RIGHT (most users are right-handed) */

      /* ---- Orientation/rotation: force Phaser to re-read the full-viewport size. ---- */
      function refreshScale() {
        var g = window.__PHASER_GAME__;
        if (g && g.scale && g.scale.refresh) { try { g.scale.refresh(); } catch (e) {} }
      }
      function onOrient() { setTimeout(refreshScale, 60); setTimeout(refreshScale, 400); }
      window.addEventListener('orientationchange', onOrient);
      new MutationObserver(function (records) {
        for (var i = 0; i < records.length; i++) if (records[i].attributeName === 'class') { setTimeout(refreshScale, 0); break; }
      }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
    })();
  </script>
</body>
</html>
