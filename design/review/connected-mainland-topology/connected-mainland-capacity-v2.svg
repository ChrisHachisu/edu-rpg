  <text x="239" y="819" class="act">ACT 1</text><text x="319" y="819" class="share">20% • 8 slots</text>

  <!-- Separator 4–5: dense tree belt with mountain shoulders. -->
  <g><use href="#tree" x="280" y="289"/><use href="#tree" x="306" y="296"/><use href="#tree" x="332" y="293"/><use href="#tree" x="485" y="292"/><use href="#tree" x="513" y="298"/><use href="#tree" x="541" y="302"/></g>
  <path d="M351 303 l17 -31 17 31 l16 -28 17 28 l17 -31 18 31" fill="#334a56" stroke="#d3d9d4" stroke-width="4"/>

  <!-- Separator 3–4: mountain range; one controlled pass. -->
  <path d="M245 461 l20 -37 20 37 l22 -41 22 41 l22 -36 21 36 M488 463 l20 -38 20 38 l22 -43 22 43 l22 -37 21 37" fill="#354b56" stroke="#d8ddd8" stroke-width="5"/>
  <rect x="405" y="446" width="62" height="18" rx="9" fill="#72583b" stroke="#e2c28a" stroke-width="3" stroke-dasharray="4 3"/>
  <text x="413" y="459" class="gate">GATE ?</text>

  <!-- Separator 2–3: irregular blocked-tree belt; Shadow Cave crossing. -->
  <g><use href="#tree" x="255" y="607"/><use href="#tree" x="287" y="614"/><use href="#tree" x="322" y="615"/><use href="#tree" x="533" y="613"/><use href="#tree" x="564" y="611"/><use href="#tree" x="596" y="613"/><use href="#tree" x="628" y="609"/></g>

  <!-- Separator 1–2: Crystal Range; retained crossing candidate. -->
  <path d="M230 768 l20 -38 20 38 l22 -43 22 43 l20 -35 20 35 M465 790 l21 -40 21 40 l23 -45 23 45 l20 -37 20 37" fill="#354b56" stroke="#d8ddd8" stroke-width="5"/>
  <path d="M393 766 L393 749" fill="none" stroke="#fff1c7" stroke-width="3" stroke-dasharray="3 3"/>
  <text x="405" y="765" class="gate">CAND. ?</text>

  <!-- Intended player progression spine, with only consecutive boundary crossings. -->
  <path d="M350 874 C420 838 467 760 475 712 C485 653 447 582 444 540 C441 492 515 433 520 383 C523 344 486 286 495 248" fill="none" stroke="#fff1c7" stroke-width="7" stroke-linecap="round" stroke-dasharray="8 13" opacity="0.9"/>
  <path d="M488 258 l7 -16 7 16" fill="none" stroke="#fff1c7" stroke-width="4"/>

