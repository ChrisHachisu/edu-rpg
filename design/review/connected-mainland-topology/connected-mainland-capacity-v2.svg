<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#071018" flood-opacity="0.48"/>
    </filter>
    <pattern id="water" width="28" height="20" patternUnits="userSpaceOnUse">
      <rect width="28" height="20" fill="#12384a"/>
      <path d="M0 10 Q7 4 14 10 T28 10" fill="none" stroke="#215568" stroke-width="2" opacity="0.6"/>
    </pattern>
    <g id="town">
      <circle r="8" fill="#ffd76a" stroke="#2c2512" stroke-width="3"/>
    </g>
    <g id="dungeon">
      <path d="M0 -9 L9 8 L-9 8 Z" fill="#a9c0c9" stroke="#172831" stroke-width="3"/>
    </g>
    <g id="questDungeon">
      <path d="M0 -9 L9 8 L-9 8 Z" fill="#78d6a3" stroke="#173426" stroke-width="3"/>
    </g>
    <g id="connector">
      <path d="M0 -10 L10 0 L0 10 L-10 0 Z" fill="#fff1c7" stroke="#4a3c24" stroke-width="3"/>
    </g>
    <g id="portal">
      <circle r="11" fill="#5f3c91" stroke="#d7b7ff" stroke-width="3"/>
      <circle r="5" fill="#1d1730" stroke="#f1e2ff" stroke-width="2"/>
    </g>
    <g id="tree">
      <rect x="-2" y="3" width="4" height="8" rx="1" fill="#5e4026"/>
      <circle cx="0" cy="-2" r="8" fill="#1b5138" stroke="#8bb07c" stroke-width="2"/>
      <circle cx="-5" cy="2" r="5" fill="#1b5138"/>
      <circle cx="5" cy="2" r="5" fill="#1b5138"/>
    </g>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f5f2e8;letter-spacing:.2px}
      .subtitle{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#aebfca}
      .act{font:800 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#142028;letter-spacing:1px}
      .share{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#263741}
      .code{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f8f2e8;paint-order:stroke;stroke:#111b22;stroke-width:3px;stroke-linejoin:round}
      .panelTitle{font:800 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f5f2e8}
      .ledgerHead{font:800 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f0cc70}
      .ledger{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#ced9df}
      .small{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#9fb2bd}
      .gate{font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff1c7;letter-spacing:.5px}
    </style>
  </defs>

  <rect width="1700" height="1050" fill="#09141c"/>
  <circle cx="1500" cy="90" r="260" fill="#123047" opacity="0.22"/>
  <circle cx="108" cy="1010" r="360" fill="#17352c" opacity="0.18"/>

  <text x="60" y="52" class="title">Connected Mainland — Capacity-First V2</text>
  <text x="60" y="79" class="subtitle">Exact progression chain • complete retained roster • natural separators • portal pads inside Act 5</text>

  <!-- Portrait composition is a review device, not a locked world aspect ratio. -->
  <g filter="url(#shadow)">
    <rect x="54" y="104" width="726" height="846" rx="28" fill="url(#water)" stroke="#345567" stroke-width="2"/>
  </g>
  <text x="76" y="133" class="small">PORTRAIT REVIEW FRAME — FINAL WORLD ASPECT RATIO NOT LOCKED</text>
  <text x="596" y="133" class="gate">ROUTE 1 → 2 → 3 → 4 → 5 ↑</text>

  <!-- One connected land substrate. The four narrow joins are blocked terrain bands. -->
  <path d="M250 890 C160 850 150 780 215 720 C240 695 278 690 298 655 C316 623 278 595 236 571 C180 538 175 470 225 425 C255 398 315 406 320 368 C326 326 260 305 242 264 C214 200 276 142 348 136 C430 128 500 158 531 205 C557 245 542 281 573 313 C610 351 682 340 703 397 C721 448 679 480 638 510 C596 541 610 584 652 618 C703 660 710 718 667 758 C629 794 582 793 546 828 C503 871 454 925 371 925 C318 925 282 912 250 890 Z" fill="#a9986a" stroke="#d7c48f" stroke-width="6"/>

  <!-- Act 5: compact cap; portal pads consume capacity inside this lobe. -->
  <path d="M270 268 C232 229 250 176 306 150 C365 123 465 138 507 178 C541 211 528 248 555 278 L515 291 C475 272 427 278 391 290 C350 304 305 296 270 268 Z" fill="#776293" stroke="#a590c2" stroke-width="3"/>
  <text x="311" y="172" class="act">ACT 5</text><text x="391" y="172" class="gate">17% • 10 slots</text><text x="391" y="188" class="gate">6 area-driving</text>

  <!-- Act 4 -->
  <path d="M324 317 C360 284 414 279 462 290 C513 301 543 326 584 334 C634 344 683 374 682 412 C681 450 639 470 593 474 C544 478 512 452 468 459 C413 468 351 473 310 438 C278 410 286 352 324 317 Z" fill="#a76449" stroke="#d28d6c" stroke-width="3"/>
  <text x="328" y="348" class="act">ACT 4</text><text x="408" y="348" class="share">20% • 6 slots</text>

  <!-- Act 3 -->
  <path d="M239 474 C279 447 334 452 375 467 C417 482 457 480 504 465 C551 449 614 470 641 507 C672 550 647 590 607 612 C568 634 522 617 477 627 C421 641 377 624 329 616 C279 608 224 585 209 542 C197 507 214 490 239 474 Z" fill="#c99b55" stroke="#ebc57f" stroke-width="3"/>
  <text x="236" y="510" class="act">ACT 3</text><text x="316" y="510" class="share">20% • 7 slots</text>

  <!-- Act 2: largest roster load, modestly widest lobe. -->
  <path d="M289 624 C335 598 380 610 426 621 C478 634 528 613 579 619 C641 626 696 660 699 704 C702 746 655 773 608 785 C558 798 522 777 477 786 C426 797 380 804 334 780 C286 755 251 716 257 674 C261 651 274 634 289 624 Z" fill="#5688a0" stroke="#88b7ca" stroke-width="3"/>
  <text x="291" y="659" class="act">ACT 2</text><text x="371" y="659" class="share">23% • 10 slots</text>

  <!-- Act 1: northwest empty shoulder removed with an inward coast notch. -->
  <path d="M216 742 C252 716 302 730 332 751 C367 776 399 789 444 790 C496 791 546 809 568 846 C590 882 557 915 515 927 C463 942 417 917 371 925 C314 935 253 919 220 885 C192 856 174 817 188 784 C195 767 205 752 216 742 Z" fill="#5d986d" stroke="#8cc59a" stroke-width="3"/>
