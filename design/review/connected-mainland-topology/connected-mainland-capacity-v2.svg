    <use href="#connector" x="405" y="0"/><text x="421" y="4" class="small">boundary mouth</text>
    <use href="#portal" x="544" y="0"/><text x="562" y="4" class="small">portal pad</text>
    <text x="717" y="4" class="small">~20h typical completion is a working content target, not a walking-distance target.</text>
  </g>
</svg>
