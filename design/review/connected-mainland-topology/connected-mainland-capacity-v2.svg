  <g><use href="#town" x="283" y="550"/><text x="295" y="554" class="code">OH</text></g>
  <g><use href="#town" x="522" y="555"/><text x="534" y="559" class="code">RC</text></g>
  <g><use href="#dungeon" x="334" y="578"/><text x="346" y="582" class="code">OD</text></g>
  <g><use href="#dungeon" x="400" y="530"/><text x="412" y="534" class="code">DT</text></g>
  <g><use href="#questDungeon" x="577" y="526"/><text x="589" y="530" class="code">BH</text></g>
  <g><use href="#dungeon" x="582" y="583"/><text x="594" y="587" class="code">SR*</text></g>
  <g><use href="#connector" x="467" y="603"/><text x="480" y="594" class="code">SH-A3</text></g>

  <!-- Act 4: 6 physical slots. -->
  <g><use href="#town" x="354" y="396"/><text x="366" y="400" class="code">ER</text></g>
  <g><use href="#dungeon" x="420" y="420"/><text x="432" y="424" class="code">EM</text></g>
  <g><use href="#questDungeon" x="543" y="397"/><text x="555" y="401" class="code">MT-1</text></g>
  <g><use href="#questDungeon" x="625" y="423"/><text x="637" y="427" class="code">MT-2</text></g>
  <g><use href="#dungeon" x="603" y="365"/><text x="615" y="369" class="code">OC</text></g>
  <g><use href="#connector" x="477" y="308"/><text x="490" y="312" class="code">VF-A4</text></g>

