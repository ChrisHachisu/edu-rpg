  <g><use href="#portal" x="520" y="207"/><text x="533" y="211" class="code">P4</text></g>

  <!-- Right-side audit ledger. -->
  <g transform="translate(824 112)">
    <rect width="820" height="838" rx="24" fill="#101f29" stroke="#2c4655" stroke-width="2"/>
    <text x="28" y="38" class="panelTitle">Capacity + retained-roster audit</text>
    <text x="28" y="62" class="small">41 physical mainland anchors • no deletions • no silent Act reassignment</text>
    <line x1="28" y1="78" x2="792" y2="78" stroke="#35505f"/>

    <g transform="translate(28 106)">
      <text class="ledgerHead">ACT 1 — 20% / 8</text>
      <text y="24" class="ledger">Towns: Greenhollow, Millbrook, Port Sapphire</text>
      <text y="44" class="ledger">Dungeons: Sunken Cellar, Whispering Woods Cave,</text>
      <text y="62" class="ledger">Coastal Reef, Darkfang Grotto, Crystal Cave mouth A1</text>
    </g>
    <g transform="translate(28 202)">
      <text class="ledgerHead">ACT 2 — 23% / 10</text>
      <text y="24" class="ledger">Towns: Ironkeep, Frostwatch, Haunted Village</text>
      <text y="44" class="ledger">Dungeons: Iron Mine, Storm Nest, Frozen Lake,</text>
      <text y="62" class="ledger">Haunted Forest mouths 1+2, Crystal Cave mouth A2,</text>
      <text y="80" class="ledger">Shadow Cave mouth A2</text>
    </g>
    <g transform="translate(28 320)">
      <text class="ledgerHead">ACT 3 — 20% / 7</text>
      <text y="24" class="ledger">Towns: Oasis Haven, Ruins Camp</text>
      <text y="44" class="ledger">Dungeons: Oasis Depths, Desert Tomb, Bandit Hideout,</text>
      <text y="62" class="ledger">Scorched Ruins*, Shadow Cave mouth A3</text>
    </g>
    <g transform="translate(28 416)">
      <text class="ledgerHead">ACT 4 — 20% / 6</text>
      <text y="24" class="ledger">Town: Ember's Rest</text>
      <text y="44" class="ledger">Dungeons: Ember Mines, Magma Tunnels mouths 1+2,</text>
      <text y="62" class="ledger">Obsidian Cavern, Volcanic Forge mouth A4</text>
    </g>
    <g transform="translate(28 512)">
      <text class="ledgerHead">ACT 5 — 17% / 10 TOTAL; 6 AREA-DRIVING</text>
      <text y="24" class="ledger">Towns: Last Bastion, Haven's Edge</text>
      <text y="44" class="ledger">Dungeons: Demon Barracks, Void Rift, Demon Castle,</text>
      <text y="62" class="ledger">Volcanic Forge mouth A5</text>
      <text y="84" class="ledger">Compact portal pads inside Act 5:</text>
      <text y="104" class="ledger">P1 Stormreach Isles • P2 Frostfall Peaks</text>
      <text y="124" class="ledger">P3 Sunken Temple Isle • P4 Twilight Realm</text>
    </g>

    <g transform="translate(28 680)">
      <text class="ledgerHead">BOUNDARY CONTRACT</text>
      <text y="24" class="ledger">Exact adjacency: Act 1—2—3—4—5</text>
      <text y="44" class="ledger">Separators: mountains and blocked tree belts only</text>
      <text y="64" class="ledger">One declared crossing per consecutive boundary</text>
      <text y="84" class="ledger">Act 1 and Act 5 have no contact or direct route</text>
      <text y="108" class="small">* Scorched Ruins remains provisional Act 3 pending explicit lock.</text>
      <text y="128" class="small">Crystal Cave crossing is a candidate only; retained behavior must verify.</text>
    </g>
  </g>

  <g transform="translate(72 978)">
    <use href="#town" x="0" y="0"/><text x="15" y="4" class="small">town</text>
    <use href="#dungeon" x="82" y="0"/><text x="98" y="4" class="small">required dungeon</text>
