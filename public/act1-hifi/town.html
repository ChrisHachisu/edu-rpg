<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Port Sapphire</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #02060a; overflow: hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* On iOS a long press -- which is just holding the movement pad -- selects the prompt text and
     raises the Copy / Look Up callout over the game. Caught on the iPhone 17 simulator; it does
     not reproduce on desktop, where a long press does nothing. */
  #stage, #stage * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #dialogue p, #dialogue b { -webkit-user-select: text; user-select: text; }
  #stage { position: absolute; inset: 0; }
  canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #boot { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center;
    background: linear-gradient(145deg, #101c27, #071018 58%, #040911); color: #9fb6c6;
    font-size: 13px; letter-spacing: .04em; transition: opacity .25s ease; }
  body[data-ready="true"] #boot { opacity: 0; visibility: hidden; }
  /* Prompt and dialogue sit in CSS pixels, not world pixels: they must stay legible at any zoom. */
  /* The prompt is also the ACTION BUTTON. There is no hardware keyboard on a phone, so if the
     only route into interact() stayed `keydown` the shop, healer, save point and every NPC would
     be unreachable in the app -- caught on the iPhone 17 simulator. Reusing the prompt rather than
     adding a second control keeps one affordance that already appears exactly when there is
     something to interact with and already names it ("Shop" / "Save" / "Talk to ..."). */
  /* 2026-08-24, from device. Owner: "the interaction buttons are overlayed on top of the control
     pad but it needs to be moved in the same location as the dungeons. i don't know why you do not
     re-use working systems in different screens."

     He is right on both counts. `bottom: 22%` is PROPORTIONAL and the pad is ABSOLUTE, so they were
     never going to agree: measured on a 390x844 phone the pill ran x 156-233 / y 618-658 against a
     pad at x 198-370 / y 596-768 -- overlapping even with the shortest label there is ("Shop", 77px
     wide). "Talk to Shopkeeper" is about 180px and would sit half inside the stick.

     The dungeon solved this already and the number is not a new one: `#a1mInteract` in
     public/dq-tiles.js sits at `bottom: calc(260px + inset)`. The stick is 172px tall standing
     76px + inset off the bottom, so its top edge is at 248px and 260px clears it by 12. This file's
     own #pad comment already documents that exact geometry -- 172px, 76px + inset up, 20px in --
     which is why the two screens can share one constant instead of each inventing one. Same
     var(--sa-bottom) the parent posts in, for the same reason #dialogue uses it: env() resolves to
     0 inside this same-origin iframe. */
  #prompt { position: absolute; left: 50%;
    bottom: calc(260px + var(--sa-bottom, env(safe-area-inset-bottom, 0px)));
    transform: translateX(-50%);
    padding: 10px 20px; border-radius: 999px; background: rgba(8,14,20,.82);
    border: 1px solid rgba(150,200,230,.34); color: #dcecf7; font-size: 15px;
    white-space: nowrap; opacity: 0; transition: opacity .12s ease; pointer-events: none;
    touch-action: manipulation; z-index: 12; }
  /* Hit-target only while visible: an invisible pill must never swallow a tap meant for the map. */
  #prompt[data-show="true"] { opacity: 1; pointer-events: auto; }
  #prompt:active { background: rgba(24,42,58,.92); }
  /* 2026-08-14, from device: the owner reported "Talk to X" hidden under the bottom tab bar. It
     was never actually moved to clear it -- this rule still read 12px + env(safe-area-inset-bottom),
     the SAME two mistakes #pad's own comment above already documents and was fixed for: (1) 12px is
     far short of the parent's .field-tabs bar, which runs about 62px of content plus the safe-area
     inset, not 12px; (2) env(safe-area-inset-bottom) resolves to 0 inside this same-origin iframe,
     so on a device with a home indicator it was adding nothing at all. Reuses #pad's own proven
     geometry (76px + the REAL inset the parent posts as --sa-bottom) rather than inventing a second
     number, so the dialogue box clears the same bar the d-pad already clears. */
  #dialogue { position: absolute; left: 12px; right: 12px;
    bottom: calc(76px + var(--sa-bottom, env(safe-area-inset-bottom, 0px))); z-index: 12;
    padding: 14px 16px; border-radius: 12px; background: rgba(6,12,18,.94);
    border: 1px solid rgba(150,200,230,.42); color: #eaf3fa; display: none; }
  #dialogue[data-open="true"] { display: block; }
  /* The stick is INERT while a dialogue is open -- the update loop zeroes the input vector when
     `talking` is set -- and the box sits in the pad's own band (both start 76px + inset off the
     bottom, and the pad is 172px tall), so leaving it drawn puts a dead control on top of the
     text the player is trying to read. The dungeon never has this problem because its modal is a
     centred full-screen card, not a bottom bar.
     Keyed off `#dialogue`'s own data-open rather than a second JS flag, so the two cannot drift
     apart; and it is only a visual hide, so if :has() were ever unsupported the fallback is
     exactly today's behaviour rather than a broken control. */
  body:has(#dialogue[data-open="true"]) #pad,
  body[data-parent-dialogue="true"] #pad,
  body[data-parent-dialogue="true"] #prompt { opacity: 0; pointer-events: none; }
  #dialogue b { display: block; margin-bottom: 6px; color: #ffd98a; font-size: 13px; letter-spacing: .05em; }
  #dialogue p { margin: 0; font-size: 15px; line-height: 1.45; }
  #dialogue small { display: block; margin-top: 10px; color: #8fa8b8; font-size: 11px; }
  /* viewport-fit=cover puts the home indicator over the bottom of the page, and the pad's lower
     band landed inside it: a drag started there is eaten by the system home / app-switcher
     gesture instead of moving the hero. Lift the pad clear of the inset.

     2026-08-06, from device: that was not enough, and the pad was also on the wrong side. The
     parent page pins a field-tab bar (#fieldTabs, z-index 90) across the bottom, and this whole
     runtime is an iframe at z-index 70 -- so a pad 18px off the bottom had its lower half behind
     a bar it cannot even see, while the overworld and the dungeons put their stick bottom-RIGHT
     and fully visible. Two consequences for the numbers below:
       - the geometry now mirrors the parent stick exactly: 172px, 76px + inset up, 20px in;
       - `env(safe-area-inset-*)` is NOT usable here. Inside a same-origin iframe it is not the
         root scroller's inset and resolves to 0, so the original calc() was adding nothing. The
         parent measures the real values with fixed probes and adapter.js posts them in as
         --sa-*; env() stays only as the standalone-preview fallback. */
  #pad { position: absolute;
    bottom: calc(76px + var(--sa-bottom, env(safe-area-inset-bottom, 0px)));
    right: calc(20px + var(--sa-right, env(safe-area-inset-right, 0px))); left: auto;
    width: 172px; height: 172px;
    /* Same skin as the parent stick, not just the same box: over the town's bright cobbles the
       old cool-grey-on-nothing was hard to find at a glance. */
    border-radius: 50%; background: rgba(26,26,46,.5); border: 2px solid #8b7340;
    box-shadow: 0 0 10px rgba(0,0,0,.5), inset 0 0 14px rgba(0,0,0,.4);
    touch-action: none; }
  /* Orientation, forwarded from the parent's ctrl-* body class so one setting drives both sticks. */
  body[data-ctrl="left"] #pad {
    left: calc(20px + var(--sa-left, env(safe-area-inset-left, 0px))); right: auto; }
  body[data-ctrl="center"] #pad { left: 50%; right: auto; transform: translateX(-50%); }
  #knob { position: absolute; left: 50%; top: 50%; width: 70px; height: 70px; margin: -35px 0 0 -35px;
    border-radius: 50%; background: rgba(201,168,76,.42); border: 2px solid rgba(201,168,76,.75);
    box-shadow: 0 0 10px rgba(0,0,0,.35); }
  #debug { position: absolute; top: 8px; left: 10px; color: #7f98a8; font-size: 11px;
    font-variant-numeric: tabular-nums; white-space: pre; }
</style>
</head>
<body data-ready="false">
<div id="stage">
  <canvas id="world" aria-label="Port Sapphire town"></canvas>
  <div id="prompt"></div>
  <div id="dialogue" role="dialog" aria-live="polite"><b></b><p></p><small>Tap to close</small></div>
  <div id="pad"><div id="knob"></div></div>
  <div id="debug"></div>
</div>
<div id="boot">Loading Port Sapphire…</div>
<script type="module">
/*
  Port Sapphire town runtime.

  This is a SEPARATE runtime from runtime.html and deliberately so. The overworld one streams
  512px chunks, resolves path corridors and drives route affinity; a town is one painting, one
  walkable polygon and a handful of stationary NPCs, so none of that machinery applies. What IS
  shared is everything that must not drift: the collision authority
  (`walkable-polygons.js`, `designLocks.collisionOwner = "r26-polygon-authority"`), the hero
  sheet, and the camera/scale numbers, all read from `manifest.json -> designLocks` rather than
  copied.
*/
import { constrainWalkableMovement, isInsideWalkable, validateWalkableGeometry }
  from './walkable-polygons.js';

const canvas = document.querySelector('#world');
const ctx = canvas.getContext('2d', { alpha: false });
const stage = document.querySelector('#stage');
const promptEl = document.querySelector('#prompt');
const dialogueEl = document.querySelector('#dialogue');
const debugEl = document.querySelector('#debug');
const pad = document.querySelector('#pad');
const knob = document.querySelector('#knob');
const search = new URLSearchParams(location.search);
const townId = search.get('town') || 'portSapphire';

// Parent chrome (control orientation + the REAL safe-area insets). See adapter.js
// postTownChrome(): env() cannot be trusted inside this iframe, so the parent measures and
// posts. Registered before the awaits below so nothing is missed while the town loads.
addEventListener('message', event => {
  const d = event.data;
  if (!d || d.type !== 'act1-town-chrome' || event.source !== parent) return;
  document.body.dataset.ctrl = d.ctrl === 'left' || d.ctrl === 'center' ? d.ctrl : 'right';
  const s = document.documentElement.style;
  s.setProperty('--sa-bottom', (Number(d.safeBottom) || 0) + 'px');
  s.setProperty('--sa-left', (Number(d.safeLeft) || 0) + 'px');
  s.setProperty('--sa-right', (Number(d.safeRight) || 0) + 'px');
  // The PARENT's message box is a text box too, and the town could not see it. Its own controls
  // hide for its own #dialogue, but a shipped message drawn over the town -- a quest update, a
  // plaque, anything routed through WorldMapScene.showMessage -- left the pad and the interact
  // button sitting on top of it (OWNER, build 67: "the joy stick and the interaction button needs
  // to be hidden whenever a text box shows up (this does not happen with key npcs)"). The parent
  // already knows; it just never said so.
  document.body.dataset.parentDialogue = d.dialogue ? 'true' : 'false';
});

const [locks, town] = await Promise.all([
  fetch('./manifest.json').then(r => r.json()).then(m => m.designLocks),
  fetch(`./town/${townId}-town.json`).then(r => {
    if (!r.ok) throw new Error(`town config ${r.status}`);
    return r.json();
  }),
]);
const walkable = await fetch(`./${town.walkable}`).then(r => r.json());
// NPCs BLOCK. Owner-confirmed working, and restored here by hand after a merge silently dropped it:
// the foreground-layer work branched from a base that predated this, so taking that side of
// town.html reverted a fix he had already signed off. The walkable authority has no concept of an
// NPC -- it knows regions, static obstacles and dynamicBlockers -- so each stationary NPC is
// registered as a zero-length dynamicBlocker segment (from === to, a plain disk via
// distanceToSegment) at her cell, BEFORE validation runs, so the geometry the game plays on is the
// one that gets checked. A 7 world-px half-width is roughly a third of a cell: enough to read as a
// solid body without swallowing the south-side approach band nearestNpc() uses for the talk prompt.
// Computed from `town.worldPxPerCell` inline rather than through cellToWorld(): validation has to
// run before the renderer's own constants exist, so that helper is not defined yet at this point in
// the file and calling it here would throw on its temporal dead zone.
const NPC_BLOCK_RADIUS = 7, NPC_CELL_W = town.worldPxPerCell;
walkable.dynamicBlockers = [
  ...(walkable.dynamicBlockers || []),
  ...town.npcs.map(n => {
    const point = { x: n.cell[0] * NPC_CELL_W, y: n.cell[1] * NPC_CELL_W };
    return { id: `npc-${n.id}`, from: point, to: point, halfWidth: NPC_BLOCK_RADIUS };
  }),
];
validateWalkableGeometry(walkable);

const loadImage = src => new Promise((resolve, reject) => {
  const image = new Image();
  image.onload = () => resolve(image);
  image.onerror = () => reject(new Error(`asset ${src}`));
  image.src = src;
});
// The foreground layer is OPTIONAL: older/other town configs may not carry one yet, and this
// runtime must keep working for them. It is the same painting's own pixels, re-extracted for the
// tall/overhead props (mast, demijohn, rooftop chimney) so they can draw AFTER the hero/NPC sort
// below and occlude her -- see scripts/derive_town_foreground.py and OWNER 2026-08-13/14,
// "draw over the hero AND be passable".
const [screenArt, foregroundArt, heroSheet, ...npcSheets] = await Promise.all([
  loadImage(`./${town.screen}`),
  town.foreground ? loadImage(`./${town.foreground}`).catch(() => null) : Promise.resolve(null),
  loadImage('./hero-g3/hero-act1-female-walk-8x3-64-g3.png'),
  ...town.npcs.map(n => loadImage(`./${n.sheet}`)),
]);
// Where that cropped foreground sits on the plate. Absent or unreadable -> the layer is skipped
// rather than drawn in the wrong place: a mis-offset occlusion layer would paint a chimney across
// open street, which is worse than not having one.
let foregroundBox = null;
if (town.foreground) {
  try {
    const r = await fetch(`./${town.foreground.replace(/\.png$/, '.json')}`);
    if (r.ok) {
      const b = await r.json();
      if (b && b.full > 0 && b.w > 0 && b.h > 0) foregroundBox = b;
    }
  } catch (e) { foregroundBox = null; }
}
if (heroSheet.naturalWidth !== 192 || heroSheet.naturalHeight !== 512) {
  throw new Error(`hero sheet is ${heroSheet.naturalWidth}x${heroSheet.naturalHeight}; `
    + 'expected 192x512. See docs/CANONICAL-ASSETS.md');
}

// ---- scale, all of it derived from the locks and the town config, none hardcoded -------------
const CELL_W = town.worldPxPerCell;                    // 16 world px per cell
const WORLD = town.cells * CELL_W;                     // 1040 world px square
const HERO_H = locks.heroWorldHeight;                  // 36
const VIEW_W = locks.cameraWorldWidth;                 // 208
const SPEED = walkable.movement?.movementSpeed ?? 52;  // world px / second
const cellToWorld = c => ({ x: c[0] * CELL_W, y: c[1] * CELL_W });

// NPC sheets are 3 cols x 4 rows of 64. The owner made these stationary, so only column 0 /
// row 0 -- the front-facing idle -- is ever drawn; the other rows exist but are unused.
const NPC_FRAME = 64;
const npcs = town.npcs.map((n, i) => ({ ...n, sheet: npcSheets[i], point: cellToWorld(n.cell) }));

const camera = { x: 0, y: 0, zoom: 1 };
function resize() {
  // OWNER 2026-08-14: the town was "way too fuzzy ... needs to match the overworld and dungeon
  // crispness". Capping at 2 on a 3x phone renders a 2x backing store and lets the compositor
  // stretch it over 3x physical pixels -- image-rendering:pixelated only turns that blur into
  // blocks, it cannot put back resolution that was never drawn. The overworld renders at the
  // device's own ratio, which is exactly the crispness he is comparing against. Capped at 3 so a
  // hypothetical 4x panel cannot quadruple the buffer.
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const { width, height } = stage.getBoundingClientRect();
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  camera.zoom = width / VIEW_W;

  /* INTEGER PIXEL SNAP — this is the fix for "the resolution is currently fuzzy on the app and i
     can clearly tell that the texture is different from the hero" (owner, build 38).

     THE ACTUAL CAUSE, measured on an iPhone 13 in WebKit 2026-08-17. The backing store above is
     already at the device's full ratio, and `imageSmoothingEnabled = false` in draw() means the
     plate is point-sampled, so nothing here is blurring anything. What was wrong is that the
     upscale factor was not a WHOLE NUMBER. The plate carries 1885 art px over 1040 world px
     (1.8125 per world px) and the view is 208 world px across 390 CSS px at dpr 3, i.e. 5.625
     device px per world px -- so each art pixel was stretched by 5.625 / 1.8125 = 3.1034x. At that
     ratio nearest sampling makes some art pixels 3 device px wide and others 4, in an irregular
     pattern. Measured on the cobbled street: only 14% of 3x3 device-pixel blocks were uniform.
     THAT irregularity is what reads as fuzz. The overworld, by contrast, lands on an exact 3x and
     measures 100% uniform blocks -- which is precisely the crispness he was comparing against, and
     why the town looked like a different material from the hero.

     So the snap rounds the ART-to-DEVICE pixel ratio to an integer and derives the zoom back from
     it. Same pixels, same detail (laplacian variance 335.8 -> 329.3, i.e. nothing added or lost);
     the grid simply becomes regular, and the same measurement then reads 100%.

     WHAT IT COSTS, stated rather than hidden: rounding 3.1034 DOWN to 3 widens the view from 208
     to 215.2 world px, 3.4% more town on screen. The 139 px/s movement calibration
     (portSapphire-walkable.json) was derived from screen-widths per second at VIEW_W = 208, so the
     hero now covers the screen 3.4% slower. Both are below perception and neither is worth
     re-deriving; VIEW_W stays the lock it was, and this reads it rather than replacing it.

     THIS IS THE CHEAP HALF OF THE FIX. It makes the grid regular; it cannot add detail the plate
     does not have. The other half is re-baking the plate at 1950x1950 (1.875 art px per world px),
     which lands on an exact 3x with NO camera change and lets the snap become a no-op -- owner
     approved 2026-08-17. Authored hard-edged for a 3x grid, that is what closes the style gap with
     the hero. See docs/FEEDBACK-BUILD-38.md (T1).

     Derived, not hardcoded: `screenArt` is awaited above, so its true width is known here, and a
     denser re-bake changes this arithmetic automatically. Generic across devices -- on a ratio that
     is already whole the rounding is identity, and a ratio below 1 (a plate denser than the screen,
     i.e. genuine downsampling) is left alone, because clamping it to 1 would zoom the camera. */
  const artPxPerWorld = (screenArt && screenArt.naturalWidth ? screenArt.naturalWidth : 1885) / WORLD;
  const rawRatio = dpr * camera.zoom / artPxPerWorld;
  if (rawRatio >= 1) camera.zoom = Math.round(rawRatio) * artPxPerWorld / dpr;
}
addEventListener('resize', () => { resize(); Object.assign(camera, cameraTarget()); });
resize();

// ---- input ------------------------------------------------------------------------------------
const held = new Set();
const KEY = { ArrowLeft:'left', a:'left', A:'left', ArrowRight:'right', d:'right', D:'right',
              ArrowUp:'up', w:'up', W:'up', ArrowDown:'down', s:'down', S:'down' };
let touchVec = { x: 0, y: 0 };
addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); interact(); return; }
  const dir = KEY[e.key];
  if (dir) { held.add(dir); e.preventDefault(); }
});
addEventListener('keyup', e => { const d = KEY[e.key]; if (d) held.delete(d); });
// Touch route into interact(). `pointerdown` rather than `click` so it answers on contact like
// the pad does, and preventDefault stops the tap becoming a synthetic click / text selection.
promptEl.addEventListener('pointerdown', e => { e.preventDefault(); interact(); });
dialogueEl.addEventListener('pointerdown', e => { e.preventDefault(); interact(); });
// AN OPEN DIALOGUE IS CLOSED BY A TAP ANYWHERE, not only by a tap on the box. The box says "Tap to
// close" and that is what it meant -- tapping the box worked, tapping beside it did nothing, and
// the box covers a strip at the bottom of a phone screen while the thing the player's thumb is
// nearest is the map (OWNER, build 66: "the tap out does not work"). Measured before changing it:
// tap ON the box -> open=false, tap OUTSIDE -> open=true.
//
// CAPTURE, and it stops the event. Without stopPropagation this would close the box and then let
// the box's own handler run interact() a SECOND time, which -- with `talking` already cleared --
// falls through to the open branch and starts the conversation again. One tap, one close.
addEventListener('pointerdown', e => {
  if (!talking) return;
  e.preventDefault();
  e.stopPropagation();
  talking = null;
  dialogueEl.dataset.open = 'false';
}, true);
let padId = null;
pad.addEventListener('pointerdown', e => {
  padId = e.pointerId; pad.setPointerCapture(e.pointerId); movePad(e);
});
pad.addEventListener('pointermove', e => { if (e.pointerId === padId) movePad(e); });
const endPad = e => {
  if (e.pointerId !== padId) return;
  padId = null; touchVec = { x: 0, y: 0 }; knob.style.transform = '';
};
pad.addEventListener('pointerup', endPad);
pad.addEventListener('pointercancel', endPad);
function movePad(e) {
  const r = pad.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  // -22 rather than -12: same knob travel as the parent stick, which is now the same size.
  const len = Math.hypot(dx, dy), max = r.width / 2 - 22;
  const k = len > max ? max / len : 1;
  knob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
  touchVec = len < 8 ? { x: 0, y: 0 } : { x: dx / Math.max(len, 1), y: dy / Math.max(len, 1) };
}
function inputVector() {
  if (touchVec.x || touchVec.y) return touchVec;
  const v = { x: (held.has('right') ? 1 : 0) - (held.has('left') ? 1 : 0),
              y: (held.has('down') ? 1 : 0) - (held.has('up') ? 1 : 0) };
  const len = Math.hypot(v.x, v.y);
  return len ? { x: v.x / len, y: v.y / len } : v;   // normalized, per designLocks.movementInput
}

// ---- state --------------------------------------------------------------------------------------
// ?at=cx,cy spawns at an arbitrary cell. This exists for verification -- a backgrounded tab
// pauses requestAnimationFrame, so the only way to check an interaction is to start beside it --
// and it doubles as the way to inspect any corner of a town without walking there.
const atParam = (search.get('at') || '').split(',').map(Number);
// FIRST ENTRY vs ARRIVAL are two different places and must stay two different fields.
// `startCell` is the ARRIVAL cell -- it is used every time the player walks in from the overworld,
// and greenhollow's sits 3.5 cells inside the painted gate so the exit arms without firing
// (see its _startNote). The NEW-GAME opening wants the hero in front of the elder instead
// (OWNER 2026-08-25: "the hero needs to start the game in front of the elder, facing him, at
// interacting distance"). Driving both off one field would teleport the player to the elder on
// every re-entry, so `firstEntryCell` is consulted ONLY on the first visit of a PLAYTHROUGH.
//
// WHO DECIDES: the PARENT does, and passes `?first=1`. This page must not decide for itself.
// Build 62 shipped the decision here, as `!localStorage.getItem('edu-rpg-town-first-<town>')`.
// That key records "this town has EVER been visited on this device", which is not the question --
// nothing clears it, least of all starting a new game, so the opening played exactly once per
// install and every later new game fell through to `startCell`, the town GATE. That is the
// regression the owner reported on build 62, and it is invisible on a fresh install, which is why
// it shipped. The lifetime that is actually wanted is the SAVE's: see adapter.js's
// `firstTownEntry()`, which reads and sets a story flag on the live player state -- story flags are
// wiped by `gameState.newGame()` and persisted by `saveGame()`, so a new game replays the opening
// and a re-entry does not. `?at=` still wins over both -- it is the verification hatch.
const firstEntry = search.get('first') === '1' && Boolean(town.firstEntryCell);
const startCell = atParam.length === 2 && atParam.every(Number.isFinite)
  ? atParam : (firstEntry ? town.firstEntryCell : town.startCell);
let position = cellToWorld(startCell);
if (!isInsideWalkable(position, walkable)) {
  // Never start outside the collision authority: constrainWalkableMovement throws if you do,
  // and a town that boots into an exception is worse than one that boots a few cells north.
  const probe = [...Array(80)].map((_, i) => ({ x: position.x, y: position.y - i * 4 }));
  const found = probe.find(p => isInsideWalkable(p, walkable));
  if (!found) throw new Error('start cell is outside the walkable geometry and no fallback found');
  position = found;
}
const state = { facing: (firstEntry && town.firstEntryFacing) || 'down', moving: false };
let talking = null;
let exitArmed = false;
let exiting = false;
// The exit is a LINE ACROSS THE TOWN'S MOUTH and the player leaves the moment she CROSSES it.
// Every town's mouth runs east-west, so the line is a y value and only the sign differs; if a town
// ever gets an east or west mouth this needs the other axis, and `exit.axis` is where to say so.
const EXIT_SIGN = (town.exit?.axis ?? (town.exit?.cell?.[1] < town.cells / 2 ? 'north' : 'south'))
  === 'north' ? -1 : 1;
// Half-width of the mouth. 2.4 cells covers the narrowest reachable crossing in all three towns --
// greenhollow spans x 30.31-34.06 at its gate, millbrook 29.31-33.88, Port Sapphire 31.44-33.75 --
// measured by BFS from startCell over the walkable authority. Too small is not a cosmetic error: a
// player hugging the edge of the gate walks straight through the line and out into the apron with
// no way to leave.
const EXIT_HALF_WIDTH = 2.4;

// Service spots are places, not people: the shop counter under the awning and the save point by
// the well. The healer is BOTH -- she is an NPC you talk to, and talking to her is the heal
// flow -- so she is resolved here rather than in nearestNpc().
const services = [
  { kind: 'shop', cell: town.shopCounter, label: 'Shop' },
  { kind: 'save', cell: town.savePoint, label: 'Save' },
].filter(s => Array.isArray(s.cell));
function nearestService() {
  let best = null;
  for (const svc of services) {
    const dx = position.x / CELL_W - svc.cell[0], dy = position.y / CELL_W - svc.cell[1];
    if (Math.abs(dx) > 1.2 || Math.abs(dy) > 1.2) continue;
    const d = Math.hypot(dx, dy);
    if (!best || d < best.d) best = { ...svc, d };
  }
  return best;
}

function nearestNpc() {
  let best = null;
  for (const npc of npcs) {
    // Approach is from the SOUTH by owner rule, so the band that counts is below the NPC.
    const dx = position.x - npc.point.x, dy = position.y - npc.point.y;
    if (Math.abs(dx) > CELL_W * 1.1 || dy < -CELL_W * 0.35 || dy > CELL_W * 2.1) continue;
    const d = Math.hypot(dx, dy);
    if (!best || d < best.d) best = { npc, d };
  }
  return best?.npc ?? null;
}
function showDialogue(name, text) {
  dialogueEl.querySelector('b').textContent = name;
  dialogueEl.querySelector('p').textContent = text;
  dialogueEl.dataset.open = 'true';
}
// TRANSLATE AT LOAD, NOT AT TAP. interact() used to paint the bundled ENGLISH immediately and
// only swap once the parent answered, so the first thing on screen was always English and stayed
// English for as long as the round trip took. Owner on build 56: "the interaction text is not
// localized (all are in english)." The strings are now requested the moment the town is ready and
// cached, so the box is drawn localised the first time it opens and nothing has to be replaced.
// The per-tap reply below is kept as a late fallback for anything the bulk pass missed.
const strings = new Map();
function localised(key, fallback) {
  const v = strings.get(key);
  // A missing key comes back from the shipped i18n as the key itself -- and, for the shipped
  // translate, as the key IN SQUARE BRACKETS. Only the bare form was rejected here, so the
  // bracketed one sailed through as if it were a translation and the player read
  // "[npc.villager2.name]" off a villager's dialogue box (OWNER, build 66: "Villager names show
  // system text"). ui-overhaul.js has always tested `charAt(0) === '['` for exactly this; the two
  // now agree. `npc.villager1.name` and `npc.villager2.name` are the two keys it bites: they exist
  // in src/i18n/locales but NOT in the frozen bundle, which predates them.
  const missing = !v || v === key || (v.charAt(0) === '[' && v.charAt(v.length - 1) === ']');
  return missing ? fallback : v;
}
addEventListener('message', event => {
  const data = event.data;
  if (!data) return;
  if (data.type === 'act1-town-strings' && data.strings) {
    for (const [k, v] of Object.entries(data.strings)) strings.set(k, v);
    if (talking) showDialogue(localised(talking.nameKey, talking.name || talking.id),
                              localised(talking.dialogueKey, talking.text));
    return;
  }
  if (data.type !== 'act1-town-text' || !talking || data.npc !== talking.id) return;
  showDialogue(data.name || talking.name, data.text || talking.text);
});

function interact() {
  if (talking) { talking = null; dialogueEl.dataset.open = 'false'; return; }
  const npc = nearestNpc();
  // The healer's heal flow lives in the shipped scene (`handleHealer` owns the full-HP check,
  // the gold check, the price and the confirm overlay), so she is handed off rather than given
  // a dialogue box here. Duplicating any of that would fork the economy.
  // The shopkeeper is a PERSON and a SERVICE, exactly like the healer. Owner 2026-08-22: "i cannot
  // find the shopkeeper and the shopkeeper needs to be in a shop"; then 2026-08-24: "the shop keeper
  // is placed on top of the shop so lets put him in front of the shop." Putting him INSIDE the stall
  // satisfied the first note and broke the second -- from a top-down camera, standing three cells
  // behind the counter among the hanging produce reads as standing ON the stall. He now stands on
  // the lane beside his counter. Either way, talking to him opens the shipped ShopScene rather than
  // a dialogue box, so the town never forks the inventory or the prices.
  const service = npc?.id === 'healer' ? { kind: 'healer' }
                : npc?.id === 'shopkeeper' ? { kind: 'shop' }
                : nearestService();
  if (service) {
    parent.postMessage({ type: 'act1-town-service', town: town.id, kind: service.kind,
                         shopId: town.shopId }, '*');
    return;
  }
  if (!npc) return;
  talking = npc;
  // Paint the bundled English immediately so there is never an empty box, then ask the parent
  // for the real localised strings. The shipped bundle owns i18n (`window.__QOK.Z`); this frame
  // must not carry a second, drifting copy of the translations.
  showDialogue(localised(npc.nameKey, npc.name || npc.id),
               localised(npc.dialogueKey, npc.text || `(${npc.dialogueKey})`));
  parent.postMessage({ type: 'act1-town-interact', town: town.id, npc: npc.id,
                       dialogueKey: npc.dialogueKey, nameKey: npc.nameKey }, '*');
}

// ---- draw ---------------------------------------------------------------------------------------
const artScale = WORLD / screenArt.naturalWidth;   // 1885 art px -> 1040 world px
function drawActor(sheet, point, col, row, cells, time, moving) {
  const bob = moving ? Math.sin(time / 125 * Math.PI) * 0.55 : Math.sin(time / 400) * 0.18;
  ctx.save();
  ctx.translate(point.x, point.y);
  ctx.fillStyle = 'rgba(0,0,0,.42)';
  ctx.beginPath(); ctx.ellipse(0, 0, 9, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  // Same anchor as the overworld: the sheet's foot baseline sits at row 58 of a 64px cell, so
  // the sprite is lifted by that fraction of its drawn height and the cell coordinate is FEET.
  ctx.drawImage(sheet, col * cells, row * cells, cells, cells,
    -HERO_H / 2, -HERO_H * 58 / 64 + bob, HERO_H, HERO_H);
  ctx.restore();
}
function draw(time) {
  const dpr = Math.min(3, devicePixelRatio || 1);   // must match resize(); see there
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#02060a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr * camera.zoom, 0, 0, dpr * camera.zoom,
    -camera.x * dpr * camera.zoom, -camera.y * dpr * camera.zoom);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(screenArt, 0, 0, screenArt.naturalWidth, screenArt.naturalHeight,
    0, 0, WORLD, WORLD);
  // Painter's order by foot Y, so a character in front of a building overlaps correctly.
  const actors = [...npcs.map(n => ({ y: n.point.y, draw: () =>
      drawActor(n.sheet, n.point, 0, 0, NPC_FRAME, time, false) })),
    { y: position.y, draw: () => drawActor(heroSheet, position,
        state.moving ? [0, 1, 0, 2][Math.floor(time / locks.walkPoseMs) % 4] : 0,
        // ROW 4 IS NORTH, NOT ROW 3. The g3 sheet is 3 pose columns x 8 DIRECTION rows, a 45-degree
        // wheel starting at south: 0=S 1=SW 2=W 3=NW 4=N 5=NE 6=E 7=SE (scripts/bake_hero_north_row.py
        // states the wheel and exists solely because row 4 had to be redrawn). Mapping up->3 draws
        // the NORTH-WEST three-quarter view, in which her FACE is still visible, so walking north
        // never showed her back. Owner, repeatedly and across all three towns: "the hero's back shot
        // (north facing shot) is still incorrect ... you never got around to match it with the
        // overworld and dungeons." The redrawn row was there the whole time; nothing read it.
        { down: 0, left: 2, up: 4, right: 6 }[state.facing], 64, time, state.moving) }];
  actors.sort((a, b) => a.y - b.y).forEach(a => a.draw());
  // Foreground: overhead props re-painted from the SAME source pixels, always last. These are
  // tall/hanging things (a ship's mast and rigging, a demijohn on its chain, a rooftop chimney)
  // that must always occlude an actor standing beneath or behind them, regardless of foot-Y sort
  // order -- the camera looks down at a fixed angle from which she can never be "in front of"
  // something that tall. Drawing with the identical source/dest rect as the base layer above
  // keeps this pixel-aligned with it for free; see scripts/derive_town_foreground.py.
  // CROPPED TO ITS CONTENT, not full-plate. The extraction is inherently sparse -- measured at
  // 0.53% opaque -- so a full 1885x1885 layer spent 14.2 MB of decoded RGBA to carry a handful of
  // props, on the device this whole line of work exists to keep alive. Cropped to the alpha bbox it
  // is 2.1 MB, and `portSapphire-foreground.json` carries the offset so it still lands pixel-exact
  // over the base painting. `full` is recorded so the mapping stays correct if the plate is ever
  // re-rendered at another size.
  if (foregroundArt && foregroundBox) {
    const k = WORLD / foregroundBox.full;
    ctx.drawImage(foregroundArt, 0, 0, foregroundArt.naturalWidth, foregroundArt.naturalHeight,
      foregroundBox.x * k, foregroundBox.y * k, foregroundBox.w * k, foregroundBox.h * k);
  }
}

// The camera target is a function so entry and every later frame agree. Easing in from (0,0)
// on the first frame is wrong twice: the player would see the town pan in from its corner, and
// a paused rAF (a backgrounded tab, which is exactly how the verification harness loads this)
// leaves the view stuck wherever the ease got to.
function cameraTarget() {
  const width = canvas.clientWidth, height = canvas.clientHeight;
  return {
    x: Math.max(0, Math.min(WORLD - width / camera.zoom, position.x - width / (2 * camera.zoom))),
    y: Math.max(0, Math.min(WORLD - height / camera.zoom, position.y - height / (2 * camera.zoom))),
  };
}
Object.assign(camera, cameraTarget());

let last = 0;
function frame(now) {
  const delta = last === 0 ? 0 : Math.min(0.05, (now - last) / 1000);
  last = now;
  const input = talking ? { x: 0, y: 0 } : inputVector();
  state.moving = Boolean(input.x || input.y);
  if (state.moving) {
    state.facing = Math.abs(input.x) > Math.abs(input.y)
      ? (input.x > 0 ? 'right' : 'left')
      : (input.y > 0 ? 'down' : 'up');
    const result = constrainWalkableMovement(position,
      { x: input.x * SPEED * delta, y: input.y * SPEED * delta }, walkable);
    position = result.position ?? result;
  }
  // ---- leaving the town ---------------------------------------------------------------------
  // CROSSING the mouth leaves. This used to be a symmetric box -- fire when |dy| < 1.0 and
  // |dx| < 1.6 of `exit.cell` -- and the box is what made the exit feel wrong twice running. It
  // fires a WHOLE CELL BEFORE the line on the way out, so on build 62, with the exit on the painted
  // gate, the screen changed while the player was still inside the fence (OWNER: "the exit of the
  // town is set at a weird place"); and being symmetric it also fires a cell PAST the line, so
  // pushing the exit out to the map edge to fix that left an eight-cell trudge across empty grass
  // (OWNER, build 63: "the player needs to exit the town the moment they touch the edge of the
  // town. currently they need to walk off of the map to exit it").
  //
  // A directional test has neither failure: `outward` is negative inside the town and crosses zero
  // exactly at the line, so the transition happens on the step that reaches the gate and nowhere
  // else. It also makes `exit.cell` mean what it says -- it is the line, and the minimap marker
  // drawn from it now sits where the screen actually changes.
  //
  // ARMING still exists, but for the only reason it ever had: never fire on the frame the player
  // arrives. She spawns at `startCell`, several cells inside, so she arms immediately and cannot
  // fire until she has walked out; the old "2.5 cells clear in any direction" was measuring the
  // wrong thing, because with a crossing test the inside is a half-plane, not a radius.
  const exitCell = town.exit?.cell ?? town.startCell;
  const outward = (position.y / CELL_W - exitCell[1]) * EXIT_SIGN;
  const lateral = Math.abs(position.x / CELL_W - exitCell[0]);
  if (!exitArmed && outward <= -0.75) exitArmed = true;
  if (exitArmed && !exiting && outward >= 0 && lateral < EXIT_HALF_WIDTH) {
    exiting = true;
    parent.postMessage({ type: 'act1-town-exit', town: town.id,
                         targetMapId: town.exit?.targetMapId ?? 'overworld',
                         toX: town.exit?.toX, toY: town.exit?.toY }, '*');
  }

  const target = cameraTarget();
  const ease = delta > 0 ? 1 - Math.exp(-delta * 8) : 1;
  camera.x += (target.x - camera.x) * ease;
  camera.y += (target.y - camera.y) * ease;
  draw(now);
  const nearNpc = talking ? null : nearestNpc();
  const nearSvc = talking ? null : (nearNpc?.id === 'healer' ? null : nearestService());
  const label = nearSvc ? nearSvc.label
    : nearNpc ? (nearNpc.id === 'healer' ? `Talk to ${nearNpc.name || nearNpc.id}`
                                         : `Talk to ${nearNpc.name || nearNpc.id}`)
    : null;
  promptEl.dataset.show = label ? 'true' : 'false';
  if (label) promptEl.textContent = label;
  if (debugEl && search.has('debug')) {
    debugEl.textContent = `cell ${(position.x / CELL_W).toFixed(1)}, ${(position.y / CELL_W).toFixed(1)}`
      + `\nview ${VIEW_W} world px  hero ${HERO_H}`;
  }
  requestAnimationFrame(frame);
}
document.body.dataset.ready = 'true';
document.body.dataset.town = town.id;
document.body.dataset.heroSheet = `${heroSheet.naturalWidth}x${heroSheet.naturalHeight}`;
window.__ACT1_TOWN__ = { town, walkable, npcs, state, interact, nearestNpc, nearestService,
  exitState: () => ({ armed: exitArmed, exiting }),
  position: () => position, camera, locks };
parent.postMessage({ type: 'act1-town-ready', town: town.id }, '*');
// Every key this town can ever show, asked for once. The parent owns i18n; this frame owns none.
parent.postMessage({ type: 'act1-town-strings-request', town: town.id,
  keys: [...new Set(npcs.flatMap(n => [n.nameKey, n.dialogueKey]).filter(Boolean))] }, '*');
requestAnimationFrame(frame);
</script>
</body>
</html>
