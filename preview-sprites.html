<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sprite Preview — Old vs New</title>
<style>
  body { background: #1a1a2e; color: #eee; font-family: monospace; padding: 20px; }
  h1 { color: #ffcc44; }
  h2 { color: #88bbff; margin-top: 40px; }
  .row { display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; }
  .sprite-box { text-align: center; }
  .sprite-box canvas { image-rendering: pixelated; border: 1px solid #444; background: #222244; }
  .label { margin-top: 4px; font-size: 12px; color: #aaa; }
  .section { margin-bottom: 40px; border-bottom: 1px solid #333; padding-bottom: 20px; }
</style>
</head>
<body>
<h1>Sprite Preview — Current vs Improved</h1>

<div class="section">
<h2>Hero Knight (all 4 color schemes, front-facing)</h2>
<div class="row" id="hero-row"></div>
</div>

<div class="section">
<h2>NPCs</h2>
<div class="row" id="npc-row"></div>
</div>

<script>
const SCALE = 6; // Preview scale (large for visibility)
const SIZE = 16; // Sprite canvas size

function createCanvas(label, parentId) {
  const box = document.createElement('div');
  box.className = 'sprite-box';
  const canvas = document.createElement('canvas');
  canvas.width = SIZE * SCALE;
  canvas.height = SIZE * SCALE;
  const lbl = document.createElement('div');
  lbl.className = 'label';
  lbl.textContent = label;
  box.appendChild(canvas);
  box.appendChild(lbl);
  document.getElementById(parentId).appendChild(box);
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  return ctx;
}

function hex(color) {
  const r = (color >> 16) & 0xff;
  const g = (color >> 8) & 0xff;
  const b = color & 0xff;
  return `rgb(${r},${g},${b})`;
}

function fill(ctx, color, x, y, w, h) {
  ctx.fillStyle = hex(color);
  ctx.fillRect(x * SCALE, y * SCALE, w * SCALE, h * SCALE);
}

function fillA(ctx, color, alpha, x, y, w, h) {
  const r = (color >> 16) & 0xff;
  const g = (color >> 8) & 0xff;
  const b = color & 0xff;
  ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
  ctx.fillRect(x * SCALE, y * SCALE, w * SCALE, h * SCALE);
}

// ===== COLOR SCHEMES =====
const SCHEMES = {
  gray:  { armor: 0x8899bb, armorDark: 0x667799, helmet: 0x7788aa, plume: 0xcc2222, cape: 0x2244aa, capeDark: 0x1a3388, shield: 0x2244aa, shieldEdge: 0xddaa33 },
  blue:  { armor: 0x4477dd, armorDark: 0x3355aa, helmet: 0x3366cc, plume: 0xffffff, cape: 0x2255cc, capeDark: 0x1a44aa, shield: 0x2255cc, shieldEdge: 0xccccdd },
  pink:  { armor: 0xcc6699, armorDark: 0xaa4477, helmet: 0xbb5588, plume: 0xffeeff, cape: 0xdd4488, capeDark: 0xbb3366, shield: 0xdd4488, shieldEdge: 0xffc0cb },
  black: { armor: 0x444455, armorDark: 0x333344, helmet: 0x333344, plume: 0xcc2222, cape: 0x222233, capeDark: 0x111122, shield: 0x333344, shieldEdge: 0x888899 },
};

// ===== OLD HERO (current) =====
function drawOldHero(ctx, cs) {
  const ox = 0, oy = 0;
  // Cape behind
  fill(ctx, cs.cape, ox+4, oy+7, 8, 5);
  // Armor body
  fill(ctx, cs.armor, ox+5, oy+5, 6, 7);
  fill(ctx, cs.armorDark, ox+5, oy+9, 6, 2);
  // Helmet
  fill(ctx, cs.helmet, ox+5, oy+1, 6, 5);
  fill(ctx, cs.helmet, ox+4, oy+2, 8, 3);
  // Visor
  fill(ctx, 0x222233, ox+6, oy+3, 4, 2);
  // Eye slit
  fill(ctx, 0xeeeeff, ox+7, oy+3, 1, 1);
  fill(ctx, 0xeeeeff, ox+9, oy+3, 1, 1);
  // Plume
  fill(ctx, cs.plume, ox+7, oy+0, 2, 2);
  // Sword
  fill(ctx, 0xccccdd, ox+11, oy+4, 2, 7);
  fill(ctx, 0xddaa33, ox+10, oy+8, 4, 1);
  // Shield
  fill(ctx, cs.shield, ox+2, oy+5, 3, 5);
  fill(ctx, cs.shieldEdge, ox+2, oy+5, 3, 1);
  fill(ctx, cs.shieldEdge, ox+2, oy+9, 3, 1);
  // Boots
  fill(ctx, 0x554433, ox+5, oy+12, 3, 3);
  fill(ctx, 0x554433, ox+8, oy+12, 3, 3);
}

// ===== NEW HERO (improved) =====
function drawNewHero(ctx, cs) {
  const ox = 0, oy = 0;

  // Cape behind body (flowing, visible on sides)
  fill(ctx, cs.cape, ox+3, oy+7, 10, 6);
  fill(ctx, cs.capeDark, ox+4, oy+8, 8, 5);
  // Cape bottom edge detail
  fill(ctx, cs.cape, ox+3, oy+12, 2, 1);
  fill(ctx, cs.cape, ox+11, oy+12, 2, 1);

  // Armor body — shaped torso with shoulder pauldrons
  fill(ctx, cs.armor, ox+5, oy+5, 6, 7);
  // Shoulder pauldrons (rounded-ish)
  fill(ctx, cs.armor, ox+4, oy+5, 1, 2);
  fill(ctx, cs.armor, ox+11, oy+5, 1, 2);
  // Armor highlight (light strip down center)
  fillA(ctx, 0xffffff, 0.15, ox+7, oy+5, 2, 5);
  // Belt
  fill(ctx, cs.armorDark, ox+5, oy+9, 6, 1);
  // Belt buckle
  fill(ctx, 0xddaa33, ox+7, oy+9, 2, 1);
  // Armor lower (tasset/skirt)
  fill(ctx, cs.armorDark, ox+5, oy+10, 6, 2);

  // Helmet — more rounded shape
  fill(ctx, cs.helmet, ox+5, oy+1, 6, 5);
  fill(ctx, cs.helmet, ox+4, oy+2, 8, 3);
  // Helmet top ridge
  fillA(ctx, 0xffffff, 0.15, ox+6, oy+1, 4, 1);
  // Visor — wide horizontal slit
  fill(ctx, 0x222233, ox+6, oy+3, 4, 1);
  // Eyes glowing through visor slit
  fill(ctx, 0xeeeeff, ox+6, oy+3, 1, 1);
  fill(ctx, 0xeeeeff, ox+9, oy+3, 1, 1);
  // Lower face guard (subtle detail)
  fill(ctx, cs.armorDark, ox+6, oy+4, 4, 1);
  // Chin guard
  fill(ctx, cs.helmet, ox+6, oy+5, 4, 1);

  // Plume — taller, flowing
  fill(ctx, cs.plume, ox+7, oy+0, 2, 2);
  fill(ctx, cs.plume, ox+8, oy+0, 1, 1); // slight asymmetry for flow

  // Sword in right hand — blade with highlight
  fill(ctx, 0xaaaacc, ox+12, oy+3, 1, 7); // blade shadow
  fill(ctx, 0xccccdd, ox+12, oy+3, 1, 6); // blade
  fillA(ctx, 0xffffff, 0.3, ox+12, oy+3, 1, 3); // blade shine
  fill(ctx, 0xddaa33, ox+11, oy+8, 3, 1); // crossguard
  fill(ctx, 0x664422, ox+12, oy+9, 1, 1); // grip

  // Shield in left hand — detailed
  fill(ctx, cs.shield, ox+2, oy+5, 3, 5);
  fill(ctx, cs.shieldEdge, ox+2, oy+5, 3, 1); // top rim
  fill(ctx, cs.shieldEdge, ox+2, oy+9, 3, 1); // bottom rim
  fill(ctx, cs.shieldEdge, ox+2, oy+5, 1, 5); // left rim
  fill(ctx, cs.shieldEdge, ox+4, oy+5, 1, 5); // right rim
  // Shield emblem (small diamond)
  fill(ctx, 0xddaa33, ox+3, oy+6, 1, 3);

  // Boots — with detail
  fill(ctx, 0x554433, ox+5, oy+12, 3, 3);
  fill(ctx, 0x554433, ox+8, oy+12, 3, 3);
  // Boot tops
  fill(ctx, 0x665544, ox+5, oy+12, 3, 1);
  fill(ctx, 0x665544, ox+8, oy+12, 3, 1);
  // Boot soles
  fill(ctx, 0x332211, ox+5, oy+14, 3, 1);
  fill(ctx, 0x332211, ox+8, oy+14, 3, 1);
}

// ===== OLD NPC (current male) =====
function drawOldNpcMale(ctx) {
  fill(ctx, 0xddbb88, 6, 2, 4, 4); // skin
  fill(ctx, 0x553311, 5, 1, 6, 2); // hair
  fill(ctx, 0x44aa44, 5, 6, 6, 6); // clothes
  fill(ctx, 0x000000, 7, 4, 1, 1); // eyes
  fill(ctx, 0x000000, 9, 4, 1, 1);
  fill(ctx, 0x553311, 6, 12, 2, 3); // boots
  fill(ctx, 0x553311, 8, 12, 2, 3);
}

// ===== NEW NPC MALE (improved villager) =====
function drawNewNpcMale(ctx) {
  // Hair — fuller, with volume
  fill(ctx, 0x553311, 5, 1, 6, 3);
  fill(ctx, 0x442200, 5, 1, 6, 1); // hair top (darker)
  fill(ctx, 0x553311, 5, 2, 1, 2); // hair side left
  fill(ctx, 0x553311, 10, 2, 1, 2); // hair side right

  // Head/face — skin tone
  fill(ctx, 0xddbb88, 6, 2, 4, 4);
  // Ears
  fill(ctx, 0xccaa77, 5, 3, 1, 2);
  fill(ctx, 0xccaa77, 10, 3, 1, 2);
  // Eyes — more expressive (2px wide with pupil)
  fill(ctx, 0xffffff, 6, 3, 2, 2); // eye white left
  fill(ctx, 0xffffff, 8, 3, 2, 2); // eye white right
  fill(ctx, 0x222244, 7, 3, 1, 2); // pupil left
  fill(ctx, 0x222244, 9, 3, 1, 2); // pupil right
  // Mouth hint
  fill(ctx, 0xbb9977, 7, 5, 2, 1);

  // Tunic body — with collar and detail
  fill(ctx, 0x44aa44, 5, 6, 6, 4); // main tunic
  fill(ctx, 0x339933, 5, 6, 6, 1); // collar (darker)
  // Tunic center line
  fill(ctx, 0x339933, 7, 7, 2, 3);
  // Belt
  fill(ctx, 0x664422, 5, 10, 6, 1);
  fill(ctx, 0xddaa33, 7, 10, 2, 1); // buckle

  // Arms
  fill(ctx, 0xddbb88, 4, 7, 1, 3); // left arm (skin)
  fill(ctx, 0xddbb88, 11, 7, 1, 3); // right arm

  // Pants
  fill(ctx, 0x554433, 5, 11, 3, 2);
  fill(ctx, 0x554433, 8, 11, 3, 2);

  // Boots
  fill(ctx, 0x443322, 5, 13, 3, 2);
  fill(ctx, 0x443322, 8, 13, 3, 2);
  fill(ctx, 0x332211, 5, 14, 3, 1); // sole
  fill(ctx, 0x332211, 8, 14, 3, 1);
}

// ===== OLD NPC FEMALE (current) =====
function drawOldNpcFemale(ctx) {
  fill(ctx, 0xddbb88, 6, 2, 4, 4);
  fill(ctx, 0x663322, 5, 1, 6, 2);
  fill(ctx, 0x663322, 5, 3, 1, 3);
  fill(ctx, 0x663322, 10, 3, 1, 3);
  fill(ctx, 0x7744aa, 5, 6, 6, 4);
  fill(ctx, 0x6633aa, 4, 10, 8, 2);
  fill(ctx, 0x000000, 7, 4, 1, 1);
  fill(ctx, 0x000000, 9, 4, 1, 1);
  fill(ctx, 0x553311, 6, 12, 2, 3);
  fill(ctx, 0x553311, 8, 12, 2, 3);
}

// ===== NEW NPC FEMALE (improved) =====
function drawNewNpcFemale(ctx) {
  // Hair — longer, with volume and ponytail/braid hint
  fill(ctx, 0x663322, 5, 0, 6, 3); // hair top
  fill(ctx, 0x552211, 5, 0, 6, 1); // hair top highlight (darker)
  fill(ctx, 0x663322, 4, 1, 1, 5); // hair left (long)
  fill(ctx, 0x663322, 11, 1, 1, 5); // hair right (long)
  // Back hair (ponytail hint)
  fill(ctx, 0x663322, 11, 5, 1, 3);

  // Head/face
  fill(ctx, 0xddbb88, 5, 2, 6, 4);
  // Ears (behind hair)
  fill(ctx, 0xccaa77, 4, 3, 1, 1);
  fill(ctx, 0xccaa77, 11, 3, 1, 1);
  // Eyes — larger, more expressive
  fill(ctx, 0xffffff, 6, 3, 2, 2);
  fill(ctx, 0xffffff, 8, 3, 2, 2);
  fill(ctx, 0x443366, 7, 3, 1, 2); // purple pupils
  fill(ctx, 0x443366, 9, 3, 1, 2);
  // Eyelashes hint
  fill(ctx, 0x332211, 6, 3, 1, 1);
  fill(ctx, 0x332211, 10, 3, 1, 1);
  // Blush
  fillA(ctx, 0xff6688, 0.3, 5, 4, 2, 1);
  fillA(ctx, 0xff6688, 0.3, 9, 4, 2, 1);
  // Mouth
  fill(ctx, 0xcc8877, 7, 5, 2, 1);

  // Dress — bodice
  fill(ctx, 0x7744aa, 5, 6, 6, 4);
  // Collar/neckline
  fill(ctx, 0xddbb88, 7, 6, 2, 1); // V-neck skin showing
  // Dress detail — lace trim
  fill(ctx, 0x8855bb, 5, 6, 1, 4);
  fill(ctx, 0x8855bb, 10, 6, 1, 4);

  // Arms (sleeved)
  fill(ctx, 0x7744aa, 4, 7, 1, 2); // left sleeve
  fill(ctx, 0xddbb88, 4, 9, 1, 1); // left hand
  fill(ctx, 0x7744aa, 11, 7, 1, 2); // right sleeve
  fill(ctx, 0xddbb88, 11, 9, 1, 1); // right hand

  // Skirt (A-line, wider)
  fill(ctx, 0x6633aa, 4, 10, 8, 3);
  // Skirt pleat lines
  fill(ctx, 0x5522aa, 6, 10, 1, 3);
  fill(ctx, 0x5522aa, 9, 10, 1, 3);
  // Hem detail
  fill(ctx, 0x8855bb, 4, 12, 8, 1);

  // Shoes
  fill(ctx, 0x443322, 5, 13, 3, 2);
  fill(ctx, 0x443322, 8, 13, 3, 2);
}

// ===== OLD SHOPKEEPER (current) =====
function drawOldShopkeeper(ctx) {
  fill(ctx, 0xddbb88, 6, 2, 4, 4);
  fill(ctx, 0x553311, 5, 1, 6, 2);
  fill(ctx, 0xcc8844, 5, 6, 6, 6);
  fill(ctx, 0x000000, 7, 4, 1, 1);
  fill(ctx, 0x000000, 9, 4, 1, 1);
}

// ===== NEW SHOPKEEPER (improved) =====
function drawNewShopkeeper(ctx) {
  // Hat — merchant cap
  fill(ctx, 0x664422, 4, 0, 8, 2); // hat brim
  fill(ctx, 0x774433, 5, 0, 6, 1); // hat top (lighter)
  fill(ctx, 0xddaa33, 7, 0, 2, 1); // gold band

  // Hair
  fill(ctx, 0x553311, 5, 2, 1, 2);
  fill(ctx, 0x553311, 10, 2, 1, 2);

  // Head/face
  fill(ctx, 0xddbb88, 6, 2, 4, 4);
  // Ears
  fill(ctx, 0xccaa77, 5, 3, 1, 2);
  fill(ctx, 0xccaa77, 10, 3, 1, 2);
  // Eyes — friendly, slightly squinting
  fill(ctx, 0x222244, 6, 3, 2, 1);
  fill(ctx, 0x222244, 8, 3, 2, 1);
  // Bushy eyebrows
  fill(ctx, 0x553311, 6, 3, 2, 1);
  fill(ctx, 0x553311, 8, 3, 2, 1);
  // Eyes (under brows)
  fill(ctx, 0x000000, 7, 4, 1, 1);
  fill(ctx, 0x000000, 9, 4, 1, 1);
  // Mustache
  fill(ctx, 0x553311, 6, 5, 4, 1);
  // Nose
  fill(ctx, 0xccaa77, 8, 4, 1, 1);

  // Apron over tunic
  fill(ctx, 0xcc8844, 5, 6, 6, 5); // tunic
  fill(ctx, 0xeeddcc, 5, 7, 6, 4); // apron front
  fill(ctx, 0xddccbb, 6, 7, 4, 4); // apron center
  // Apron ties
  fill(ctx, 0xeeddcc, 4, 7, 1, 2);
  fill(ctx, 0xeeddcc, 11, 7, 1, 2);

  // Belt
  fill(ctx, 0x664422, 5, 6, 6, 1);
  fill(ctx, 0xddaa33, 7, 6, 2, 1); // buckle

  // Arms (behind apron, peeking)
  fill(ctx, 0xddbb88, 4, 8, 1, 2);
  fill(ctx, 0xddbb88, 11, 8, 1, 2);

  // Counter (no legs — behind counter)
  fill(ctx, 0x886644, 3, 11, 10, 2);
  fill(ctx, 0x775533, 3, 13, 10, 2);
  // Counter top detail
  fill(ctx, 0x997755, 3, 11, 10, 1);
}

// ===== OLD HEALER (current) =====
function drawOldHealer(ctx) {
  fill(ctx, 0xffffff, 6, 0, 4, 1);
  fill(ctx, 0xffffff, 7, 0, 2, 1);
  fill(ctx, 0xdd3333, 7, 0, 2, 1);
  fill(ctx, 0xffffff, 5, 1, 6, 1);
  fill(ctx, 0xddbb88, 6, 2, 4, 4);
  fill(ctx, 0x3377bb, 5, 2, 1, 1);
  fill(ctx, 0x3377bb, 10, 2, 1, 1);
  fill(ctx, 0x3377bb, 5, 3, 1, 3);
  fill(ctx, 0x3377bb, 10, 3, 1, 3);
  fill(ctx, 0x2266bb, 5, 6, 6, 4);
  fill(ctx, 0x1155aa, 4, 7, 1, 3);
  fill(ctx, 0x1155aa, 11, 7, 1, 3);
  fill(ctx, 0xffffff, 7, 7, 2, 3);
  fill(ctx, 0xffffff, 6, 8, 4, 1);
  fill(ctx, 0x1a55aa, 4, 10, 8, 2);
  fill(ctx, 0x000000, 7, 4, 1, 1);
  fill(ctx, 0x000000, 9, 4, 1, 1);
}

// ===== NEW HEALER (from scratch — female in blue) =====
function drawNewHealer(ctx) {
  // Same proportions as improved female NPC (which looks good)
  // but with blue clothes and nurse hat

  // Hair — long, dark brown, framing face
  fill(ctx, 0x553322, 5, 0, 6, 3); // hair top
  fill(ctx, 0x442211, 5, 0, 6, 1); // darker crown
  fill(ctx, 0x553322, 4, 1, 1, 5); // hair left (long)
  fill(ctx, 0x553322, 11, 1, 1, 5); // hair right (long)
  // Back ponytail hint
  fill(ctx, 0x553322, 11, 5, 1, 2);

  // Nurse hat on top of hair
  fill(ctx, 0xffffff, 6, 0, 4, 1); // white hat
  fill(ctx, 0xdd3333, 7, 0, 2, 1); // red cross

  // Head/face
  fill(ctx, 0xddbb88, 5, 2, 6, 4);
  // Ears
  fill(ctx, 0xccaa77, 4, 3, 1, 1);
  fill(ctx, 0xccaa77, 11, 3, 1, 1);
  // Eyes — large, expressive
  fill(ctx, 0xffffff, 6, 3, 2, 2);
  fill(ctx, 0xffffff, 8, 3, 2, 2);
  fill(ctx, 0x2255aa, 7, 3, 1, 2); // blue pupils
  fill(ctx, 0x2255aa, 9, 3, 1, 2);
  // Eyelashes
  fill(ctx, 0x332211, 6, 3, 1, 1);
  fill(ctx, 0x332211, 10, 3, 1, 1);
  // Blush
  fillA(ctx, 0xff6688, 0.3, 5, 4, 2, 1);
  fillA(ctx, 0xff6688, 0.3, 9, 4, 2, 1);
  // Mouth
  fill(ctx, 0xcc8877, 7, 5, 2, 1);

  // Blue top
  fill(ctx, 0x2266bb, 5, 6, 6, 4);
  // Neckline
  fill(ctx, 0xddbb88, 7, 6, 2, 1);
  // Lighter blue detail on sides
  fill(ctx, 0x3377cc, 5, 6, 1, 4);
  fill(ctx, 0x3377cc, 10, 6, 1, 4);
  // White cross on chest
  fill(ctx, 0xffffff, 7, 7, 2, 2); // vertical
  fill(ctx, 0xffffff, 6, 8, 4, 1); // horizontal

  // Arms
  fill(ctx, 0x2266bb, 4, 7, 1, 2); // left sleeve
  fill(ctx, 0xddbb88, 4, 9, 1, 1); // left hand
  fill(ctx, 0x2266bb, 11, 7, 1, 2); // right sleeve
  fill(ctx, 0xddbb88, 11, 9, 1, 1); // right hand

  // Skirt (A-line, blue)
  fill(ctx, 0x1a55aa, 4, 10, 8, 3);
  // Pleat lines
  fill(ctx, 0x1144aa, 6, 10, 1, 3);
  fill(ctx, 0x1144aa, 9, 10, 1, 3);
  // Hem
  fill(ctx, 0x3377cc, 4, 12, 8, 1);

  // Shoes
  fill(ctx, 0x443322, 5, 13, 3, 2);
  fill(ctx, 0x443322, 8, 13, 3, 2);
}

// ===== RENDER ALL =====

// Hero row
for (const [name, cs] of Object.entries(SCHEMES)) {
  const ctx1 = createCanvas(`Current (${name})`, 'hero-row');
  drawOldHero(ctx1, cs);
  const ctx2 = createCanvas(`Improved (${name})`, 'hero-row');
  drawNewHero(ctx2, cs);
}

// NPC row
const ctx_nm_old = createCanvas('Current Male NPC', 'npc-row');
drawOldNpcMale(ctx_nm_old);
const ctx_nm_new = createCanvas('Improved Male NPC', 'npc-row');
drawNewNpcMale(ctx_nm_new);

const ctx_nf_old = createCanvas('Current Female NPC', 'npc-row');
drawOldNpcFemale(ctx_nf_old);
const ctx_nf_new = createCanvas('Improved Female NPC', 'npc-row');
drawNewNpcFemale(ctx_nf_new);

const ctx_sk_old = createCanvas('Current Shopkeeper', 'npc-row');
drawOldShopkeeper(ctx_sk_old);
const ctx_sk_new = createCanvas('Improved Shopkeeper', 'npc-row');
drawNewShopkeeper(ctx_sk_new);

const ctx_hl_old = createCanvas('Current Healer', 'npc-row');
drawOldHealer(ctx_hl_old);
const ctx_hl_new = createCanvas('Improved Healer', 'npc-row');
drawNewHealer(ctx_hl_new);
</script>
</body>
</html>
